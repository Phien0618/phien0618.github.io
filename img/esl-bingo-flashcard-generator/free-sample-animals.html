<style>
:root{--board:#163A3A;--ink:#1E2030;--sun:#FFC83D;--sky:#5BB8F5;--mint:#3DD39A;--berry:#E8457A;--cut:#8C8FA3;--muted:#555A70;
--pw:8.5in;--ph:11in;--pad:.45in .45in .4in}
body.a4{--pw:210mm;--ph:297mm;--pad:12mm 12mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:"Nunito",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:var(--pw);height:var(--ph);padding:var(--pad);position:relative;overflow:hidden;break-after:page;page-break-after:always;display:flex;flex-direction:column}
.page:last-child{break-after:auto;page-break-after:auto}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;font:700 8.5pt "Nunito";color:var(--muted);padding-top:6px;flex:none}
.foot b{color:var(--ink)}
h1,h2,h3{font-family:"Fredoka",sans-serif;margin:0;font-weight:700}
.band{background:var(--board);color:#FFFDF6;border-radius:22px;padding:24px 30px 22px;position:relative;overflow:hidden}
.band .eyebrow{font:800 10pt "Nunito";letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
.band h1{font-size:46pt;line-height:1;margin-top:6px}
.band .sub{font:700 13pt "Nunito";margin-top:6px;opacity:.92}
.band .covchip{position:absolute;right:26px;top:22px;font:800 9pt "Nunito";letter-spacing:.08em;text-transform:uppercase;border:1.5px solid rgba(255,253,246,.5);border-radius:999px;padding:3px 12px;color:#FFFDF6}
.band .doodle{position:absolute;right:30px;bottom:18px;opacity:.35}
.tiles{display:flex;gap:6px;margin-top:14px}
.tile{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:700 19pt "Fredoka";color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);line-height:1}
.h2s{font-size:16pt;margin:16px 0 0}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.how{border:2px solid var(--ink);border-radius:16px;padding:12px 14px;position:relative}
.how .n{position:absolute;top:-12px;left:12px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 12pt "Fredoka";background:var(--sun)}
.how h3{font-size:13pt;margin:6px 0 4px;display:flex;align-items:center;gap:5px}
.how h3 svg{width:16px;height:12px}
.how p{font-size:10pt;margin:0;line-height:1.35;font-weight:700}
.wordgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.wg{border:1.5px solid #C9CBD6;border-radius:12px;padding:5px 4px 4px;text-align:center}
.wg svg{width:42px;height:42px;display:block;margin:0 auto}
.wg span{font:800 10pt "Nunito"}
.contents{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:14px}
.box{border-radius:14px;padding:11px 14px;font-size:10pt;line-height:1.45;font-weight:700}
.box h3{font-size:12pt;margin-bottom:4px}
.box.c{background:#FFF6E5;border:1.5px solid #E6D7B8}
.box.tip{background:#FFF1C9;border-left:6px solid var(--sun)}
.box ul{margin:0;padding-left:16px}
.sheet{flex:1;display:flex;flex-direction:column;min-height:0}
.bcard{flex:1;min-height:0;border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px 8px;display:flex;flex-direction:column;break-inside:avoid}
.cutrow{height:28px;flex:none;display:flex;align-items:center;gap:8px;color:var(--cut);font:700 7.5pt "Nunito"}
.cutrow::before,.cutrow::after{content:"";flex:1;border-top:1.5px dashed var(--cut)}
.cutrow svg{width:14px;height:14px}
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex:none}
.bhead .tiles{margin:0}
.bhead .tile{width:40px;height:40px;font-size:22pt}
.bname{margin-left:auto;font:800 10pt "Nunito";display:flex;align-items:flex-end;gap:6px}
.bname i{display:inline-block;width:150px;border-bottom:1.5px solid var(--ink);height:14px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.cell{border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;text-align:center;min-height:0}
.cell svg{width:62px;height:62px;flex:none}
.cell span{font:800 13pt "Nunito";line-height:1.1;margin-top:2px}
.bfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font:700 8.5pt "Nunito";color:var(--muted);flex:none}
.cardno{font:700 12pt "Fredoka";color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:#fff}
.ptitle{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:none}
.ptitle h2,.ptitle .h2{font:700 20pt "Fredoka";margin:0}
.ptitle .chip{font:800 9pt "Nunito";border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px}
.ptitle .hint{margin-left:auto;font:700 9pt "Nunito";color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.ptitle .hint svg{width:16px;height:16px;flex:none}
.side{font:800 9pt "Nunito";border-radius:999px;padding:2px 10px;color:#fff;background:var(--board)}
.side.bk{background:var(--berry)}
.callgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));border-top:1.5px dashed var(--cut);border-left:1.5px dashed var(--cut)}
.call{border-right:1.5px dashed var(--cut);border-bottom:1.5px dashed var(--cut);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.call svg.ic{width:74px;height:74px}
.call span{font:700 17pt "Fredoka";margin-top:2px}
.call .ck{position:absolute;top:8px;right:8px;width:14px;height:14px;border:1.5px solid var(--ink);border-radius:4px}
.fwrap{flex:1;min-height:0;position:relative;padding:14px}
.flash{height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));border-top:1.5px dashed var(--cut);border-left:1.5px dashed var(--cut)}
.fc{border-right:1.5px dashed var(--cut);border-bottom:1.5px dashed var(--cut);display:flex;align-items:center;justify-content:center;position:relative;padding:12px;min-height:0}
.fc .inner{width:100%;height:100%;border:2px solid var(--ink);border-radius:18px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}
.fc .inner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--c)}
.fc.back .inner::before{left:auto;right:0}
.fc svg{width:150px;height:150px}
.fc .word{font:700 40pt "Fredoka";line-height:1;white-space:nowrap}
.fc .tag{position:absolute;bottom:6px;right:14px;font:800 7.5pt "Nunito";color:#9A9DB0}
.fc.back .tag{right:auto;left:14px}
.crop{position:absolute;width:14px;height:14px;border:0 solid var(--ink)}
.crop.tl{top:0;left:0;border-top-width:1px;border-left-width:1px}
.crop.tr{top:0;right:0;border-top-width:1px;border-right-width:1px}
.crop.bl{bottom:0;left:0;border-bottom-width:1px;border-left-width:1px}
.crop.br{bottom:0;right:0;border-bottom-width:1px;border-right-width:1px}
body.a4 .cell svg{width:60px;height:60px}
.sample{position:absolute;left:0;right:0;top:3mm;text-align:center;font:800 7.5pt "Nunito";color:var(--berry);letter-spacing:.06em;text-transform:uppercase}
/* on-screen toolbar, not printed */
.bar{position:sticky;top:0;z-index:5;background:#163A3A;color:#FFFDF6;padding:10px 14px;font:700 14px/1.4 "Nunito",sans-serif;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar button{font:800 14px "Nunito",sans-serif;border:2px solid #FFFDF6;background:transparent;color:#FFFDF6;border-radius:8px;padding:5px 12px;cursor:pointer}
.bar button.on{background:#FFC83D;color:#1E2030;border-color:#FFC83D}
.bar a{color:#FFC83D}
@media screen{body{background:#e9e6df}.page{background:#fff;margin:16px auto;box-shadow:0 2px 10px rgba(0,0,0,.15)}}
@media print{.bar{display:none}}

</defs></svg>
<div id="pages"></div>
<script>
(function(){
var W=["cat","dog","fish","bird","rabbit","cow","pig","duck","frog","lion","elephant","monkey","bear","sheep","snake","turtle","mouse","chicken","owl","bee"];
var NAME="Animals";
var TILE=["#FFC83D","#5BB8F5","#3DD39A","#C6A6FF","#FF9DBC"],COLS=["#FFC83D","#5BB8F5","#3DD39A","#C6A6FF","#FF9DBC","#FF8A3D"];
var ARROW='<svg viewBox="0 0 16 12" fill="none" stroke="#1E2030" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h13M9 1.5L14 6 9 10.5"/></svg>';
var SCISSORS='<svg viewBox="0 0 24 24" fill="none" stroke="#8C8FA3" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5 L20 18 M8.5 16.5 L20 6"/></svg>';
var SAMPLE='<div class="sample">Free sample · page %P of 23 · full set: 30 bingo cards, 20 calling cards, 20 flashcards</div>';
function ic(id,cls){return '<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 0 64 64"><use href="#'+id+'"/></svg>';}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){arr=arr.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function foot(sec,p){return '<div class="foot"><span><b>ESL Bingo &amp; Flashcard Generator</b> · '+NAME+' · '+sec+'</span><span>p.'+p+'</span></div>';}
function smp(p){return SAMPLE.replace('%P',p);}
function render(A4){
var PAPER=A4?"A4":"US Letter",html="";
html+='<section class="page">'+smp(1)+'<div class="band"><span class="covchip">Cover</span>'+
 '<svg class="doodle" width="170" height="60" viewBox="0 0 170 70" fill="none" stroke="#FFFDF6" stroke-width="3" stroke-linecap="round"><path d="M10 50 q20 -30 40 0 t40 0 t40 0"/><path d="M150 10 l4 9 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z"/></svg>'+
 '<div class="eyebrow">ESL Bingo &amp; Flashcard Generator · Ready-to-print set 1 of 6</div><h1>'+NAME+'</h1>'+
 '<div class="sub">Picture Bingo · Calling Cards · Flashcards · 20 words · '+PAPER+'</div>'+
 '<div class="tiles">'+"BINGO".split("").map(function(c,i){return '<div class="tile" style="background:'+TILE[i]+'">'+c+'</div>';}).join("")+'</div></div>'+
 '<h3 class="h2s">3 ways to play</h3><div class="howto">'+
 '<div class="how"><div class="n">1</div><h3>Picture '+ARROW+' word</h3><p>Hold up a calling card and cover the word. Students find the matching square.</p></div>'+
 '<div class="how"><div class="n" style="background:var(--sky)">2</div><h3>Word '+ARROW+' picture</h3><p>Say or show only the word. Students find the picture. Good for reading practice.</p></div>'+
 '<div class="how"><div class="n" style="background:var(--mint)">3</div><h3>Listen &amp; find</h3><p>Give a clue, e.g. <i>"It has long ears and it hops."</i> Students find the word.</p></div></div>'+
 '<h3 class="h2s">The 20 words</h3><div class="wordgrid">'+W.map(function(w){return '<div class="wg">'+ic(w)+'<span>'+w+'</span></div>';}).join("")+'</div>'+
 '<div class="contents"><div class="box c"><h3>In this set (23 pages)</h3><ul><li><b>30 bingo cards</b>, 4×4, every card has a different set of words (pages 2–16)</li><li><b>20 calling cards</b> with cut lines (page 17)</li><li><b>20 flashcards</b>, picture front / word back, 3 sheets (pages 18–23)</li></ul></div>'+
 '<div class="box tip"><h3>Printing tips</h3>Set scale to <b>100% / Actual size</b>.<br>Flashcards: print pages 18–23 double-sided, <b>flip on long edge</b>. The small tag (A1, A2…) matches front and back.</div></div>'+
 foot("Cover",1)+'</section>';
var r=rng(2026),seen={},cards=[];
while(cards.length<2){var s=shuffle(W,r).slice(0,16);var key=s.slice().sort().join("|");if(!seen[key]){seen[key]=1;cards.push(s);}}
function bingo(words,no){var h='<div class="bcard"><div class="bhead"><div class="tiles">'+"BINGO".split("").map(function(ch,i){return '<div class="tile" style="background:'+TILE[(i+no-1)%5]+'">'+ch+'</div>';}).join("")+'</div><div class="bname">Name <i></i></div></div><div class="grid">';
 words.forEach(function(w,i){var st=((i%4)==3?'border-right:0;':'')+(i>=12?'border-bottom:0;':'');h+='<div class="cell" style="'+st+'">'+ic(w)+'<span>'+w+'</span></div>';});
 return h+'</div><div class="bfoot"><span>'+NAME+' · Picture Bingo 4×4</span><span class="cardno">#'+no+'</span></div></div>';}
html+='<section class="page">'+smp(2)+'<div class="sheet">'+bingo(cards[0],1)+'<div class="cutrow">'+SCISSORS+'cut here</div>'+bingo(cards[1],2)+'</div>'+foot("Bingo Cards",2)+'</section>';
html+='<section class="page">'+smp(17)+'<div class="ptitle"><h2>Calling Cards</h2><span class="chip">'+NAME+' · 20 cards</span><span class="hint">'+SCISSORS.replace('#8C8FA3','#555A70')+'Cut on the dashed lines · tick the box when called</span></div><div class="callgrid">'+
 W.map(function(w){return '<div class="call"><span class="ck"></span>'+ic(w,"ic")+'<span>'+w+'</span></div>';}).join("")+'</div>'+foot("Calling Cards",17)+'</section>';
function fs(w){return Math.min(40,Math.floor((A4?360:372)/w.length))+"pt";}
var items=W.slice(0,8),L="A",front="",back="";
for(var i=0;i<8;i++){var w=items[i];front+='<div class="fc" style="--c:'+COLS[i%6]+'"><div class="inner">'+ic(w)+'<span class="tag">'+L+(i+1)+'</span></div></div>';}
for(var row=0;row<4;row++)for(var col=0;col<2;col++){var k=row*2+(1-col),w2=items[k];back+='<div class="fc back" style="--c:'+COLS[k%6]+'"><div class="inner"><span class="word" style="font-size:'+fs(w2)+'">'+w2+'</span><span class="tag">'+L+(k+1)+'</span></div></div>';}
var crop='<span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>';
html+='<section class="page">'+smp(18)+'<div class="ptitle"><h2>Flashcards</h2><span class="side">FRONT · sheet 1</span><span class="hint">Print double-sided · flip on long edge</span></div><div class="fwrap">'+crop+'<div class="flash">'+front+'</div></div>'+foot("Flashcards",18)+'</section>';
html+='<section class="page">'+smp(19)+'<div class="ptitle"><div class="h2">Flashcards</div><span class="side bk">BACK · sheet 1</span><span class="hint">Columns are mirrored so each word lands behind its picture</span></div><div class="fwrap">'+crop+'<div class="flash">'+back+'</div></div>'+foot("Flashcards",19)+'</section>';
document.getElementById("pages").innerHTML=html;
document.body.classList.toggle("a4",A4);
document.getElementById("pagesize").textContent="@page{size:"+(A4?"A4":"letter")+";margin:0}";
document.getElementById("bA4").className=A4?"on":"";document.getElementById("bLT").className=A4?"":"on";
}
document.getElementById("bA4").onclick=function(){render(true);};
document.getElementById("bLT").onclick=function(){render(false);};
document.getElementById("bPr").onclick=function(){window.print();};
render(!/letter/i.test(location.hash));
})();
</script>
</body></html>
