function newDeck(items){return{all:items,q:shuffle(items.slice())};}
function pull(d){return d.q.length?d.q.pop():null;}
function exhausted(){modal(`<h2>All words used — reshuffle?</h2><p>Every word in this set has been played once.</p><div class="mrow"><button class="btn" data-a="home">Change units</button><button class="btn pri" data-a="reshuffle">${IC.restart}Reshuffle</button></div>`,'reshuffle');}
function startGame(id){if(!OPEN_G.has(id)){modal(`<h2>${GAMES[id].name} is in the full version</h2><p>The full version has 6 games, 22 sound units, 452 built-in words, 48 pictures and saved word lists of up to 100 words.</p><div class="mrow"><button class="btn" data-a="close">Back</button><a class="btn pri" style="text-decoration:none" href="${BUY_URL}" target="_blank" rel="noopener">Get the full version</a></div>`,'close');return;}
 if(pool().length<5){toast('Choose at least 5 words');return;}if(ST.turn>=ST.teams)ST.turn=0;ST.screen='game';G=MAKE[id]();G.id=id;G.init();tmReset();render();}
const pcard=(k,size,rot)=>`<div class="pc" style="width:${size}px;height:${size}px;${rot?'transform:rotate(3deg)':''}">${picSVG(k).replace('<svg','<svg width="'+Math.round(size*.74)+'" height="'+Math.round(size*.74)+'"')}</div>`;
const meanHTML=it=>it&&it.m?`<div class="mean">${esc(it.m)}</div>`:'';
function optBtn(i,inner,state,act,w,h){const mk=state==='right'?IC.check:state==='wrong'?IC.cross:'';return`<button class="opt ${state||''}" style="width:${w}px;height:${h}px" data-a="${act}" data-v="${i}" ${state!==undefined&&state!==null?'disabled':''}><span class="num">${i+1}</span>${inner}${mk?mk.replace('<svg','<svg class="mk"'):''}</button>`;}
const MAKE={
wb:()=>({init(){this.mode=ST.wb;const p=pool();const fam={};p.forEach(it=>{const s=split(it);const k=s.ri.join('').toLowerCase();(fam[k]=fam[k]||[]).push(it);});
  this.fams=Object.keys(fam).map(k=>({ri:k,words:fam[k]}));this.pics=p.filter(it=>it.pic&&split(it).on.length);if(this.mode==='pic'&&!this.pics.length)this.mode='swap';
  this.deck=newDeck(this.mode==='pic'?this.pics:this.fams);this.onsets=[...new Set(p.map(it=>split(it).on.join('').toLowerCase()).filter(Boolean))];this.next(true);},
 next(first){if(!first&&!this.jd)nextTurn();const c=pull(this.deck);if(!c){exhausted();return false;}this.jd=false;this.cur=c;this.i=0;this.ans=null;
  if(this.mode==='pic'){const s=split(c),on=s.on.join('').toLowerCase(),ri=s.ri.join('').toLowerCase();let ds=shuffle(this.onsets.filter(o=>o!==on&&!BLOCK.has(o+ri)&&!REAL.has(o+ri)));
   ds=ds.concat(shuffle('bcdfghjlmnprstvwz'.split('').filter(o=>o!==on&&!ds.includes(o)&&!BLOCK.has(o+ri)&&!REAL.has(o+ri))));this.opts=shuffle([on,ds[0],ds[1]]);}return true;},
 draw(){const segs=`<div class="seg"><span class="lbl">Mode</span><button class="sg ${this.mode==='swap'?'on':''}" data-a="wbmode" data-v="swap">Swap sounds</button><button class="sg ${this.mode==='pic'?'on':''}" data-a="wbmode" data-v="pic" ${this.pics.length?'':'disabled'}>Picture word</button></div>`;
  if(this.mode==='swap'){const f=this.cur,it=f.words[this.i],s=split(it);const many=f.words.length>1;
   const onT=s.on.length?`<div class="tile sun">${word(s.on,{btn:1,px:190,maxW:420,maxH:330})}</div>`:`<div class="tile empty"></div>`;
   const hint=f.words.map((w,j)=>{const o=split(w).on.join('')||'–';return j===this.i?`<b style="color:#2A2340">${esc(o)}</b>`:esc(o);}).join(' · ');
   return`${turnChip()}${segs}<div style="position:absolute;left:0;right:0;top:92px;height:520px;display:flex;align-items:center;justify-content:center;gap:56px"><div style="display:flex;flex-direction:column;align-items:center;gap:18px"><button class="arr" data-a="up" ${many?'':'disabled'} aria-label="previous first sound">${IC.up}</button>${onT}<button class="arr" data-a="dn" ${many?'':'disabled'} aria-label="next first sound">${IC.dn}</button></div>
   <div class="tile">${word(s.ri,{btn:1,px:190,maxW:640,maxH:330})}</div>${it.pic?pcard(it.pic,330,1):''}</div><div class="hint" style="position:absolute;left:0;right:0;top:622px">${many?'First sounds in this family: ':'Only one word in this family: '}${hint}</div>${it.m?`<div class="mean" style="position:absolute;left:0;top:676px">${esc(it.m)}</div>`:''}
   <div class="acts"><button class="btn no" data-a="wbj" data-v="0">${IC.cross}Not yet</button><button class="btn ok" data-a="wbj" data-v="1">${IC.check}Read it!</button><button class="btn pri" data-a="next">Next family${IC.next}Space</button></div>`;}
  const it=this.cur,s=split(it),done=this.ans!==null,on=s.on.join('').toLowerCase();
  const onT=done?`<div class="tile sun">${word(s.on,{btn:1,px:190,maxW:420,maxH:330})}</div>`:`<div class="tile sun" style="min-width:200px">${W1('?',190,{maxH:330})}</div>`;
  const opts=this.opts.map((o,i)=>optBtn(i,W1(o,96,{maxW:250,maxH:150}),done?(o===on?'right':o===this.ans?'wrong':''):null,'wbo',300,150)).join('');
  return`${turnChip()}${segs}<div style="position:absolute;left:0;right:0;top:86px;height:400px;display:flex;align-items:center;justify-content:center;gap:48px">${pcard(it.pic,360)}${onT}<div class="tile">${word(s.ri,{btn:1,px:190,maxW:560,maxH:330})}</div></div>
  <div style="position:absolute;left:0;right:0;top:520px;display:flex;justify-content:center;gap:40px">${opts}</div>${done?`<div style="position:absolute;left:0;top:690px">${meanHTML(it)}</div>`:''}<div class="acts"><button class="btn ${done?'pri':''}" data-a="next">${done?'Next':'Skip'}${IC.next}Space</button></div>`;},
 act(a,v){if(a==='up'||a==='dn'){const n=this.cur.words.length;this.i=(this.i+(a==='up'?-1:1)+n)%n;render();}
  else if(a==='wbj'){award(v==='1');nextTurn();this.jd=true;const n=this.cur.words.length;if(n>1)this.i=(this.i+1)%n;render();}
  else if(a==='wbo'&&this.ans===null){const on=split(this.cur).on.join('').toLowerCase();this.ans=this.opts[+v];award(this.ans===on);render();}
  else if(a==='wbmode'){ST.wb=v;this.init();render();}},
 space(){if(this.next())render();},key(k){if(this.mode==='swap'&&(k==='ArrowUp'||k==='ArrowDown')){this.act(k==='ArrowUp'?'up':'dn');return true;}if(this.mode==='pic'&&/^[1-3]$/.test(k)){this.act('wbo',String(+k-1));return true;}return false;}}),
ss:()=>({init(){const p=pool();this.keys=new Set(p.map(it=>(soundOf(it)||{}).key));this.deck=newDeck(p.filter(it=>soundOf(it)));this.next(true);},
 next(first){if(!first)nextTurn();const c=pull(this.deck);if(!c){exhausted();return false;}this.cur=c;this.snd=soundOf(c);this.ans=null;this.opts=shuffle([this.snd.key,...distract(c,this.snd,ST.ss-1,this.keys)]);return true;},
 draw(){const it=this.cur,done=this.ans!==null;const hi=done?hiOf(it,this.snd):[];
  const seg=`<div class="seg"><span class="lbl">Answers</span>${[2,3,4].map(n=>`<button class="sg ${ST.ss===n?'on':''}" data-a="ssn" data-v="${n}">${n}</button>`).join('')}</div>`;
  const q=this.snd.kind==='t'||this.snd.kind==='m'?'Which spelling is in the word?':'Which sound is in the word?';
  const left=it.pic?`${pcard(it.pic,400)}<div style="height:150px;display:flex;align-items:center">${done?word(it.ch,{hl:hi,px:120,maxW:620,maxH:150}):'<span class="hint">Say the word. Listen for the sound.</span>'}</div>`:`<div class="pc" style="width:640px;height:400px">${word(it.ch,{hl:hi,px:180,maxW:580,maxH:330})}</div><div style="height:150px"></div>`;
  const oh=ST.ss===4?118:ST.ss===3?136:150;const opts=this.opts.map((k,i)=>optBtn(i,W1(k,88,{maxW:420,maxH:oh-16}),done?(k===this.snd.key?'right':k===this.ans?'wrong':''):null,'sso',620,oh)).join('');
  return`${turnChip()}${seg}<div style="position:absolute;left:40px;top:96px;width:680px;display:flex;flex-direction:column;align-items:center;gap:24px">${left}</div><div style="position:absolute;left:820px;right:0;top:96px;display:flex;flex-direction:column;gap:22px;align-items:flex-start"><div style="font:800 40px var(--ui)">${q}</div>${opts}${done?meanHTML(it):''}</div>
  <div class="acts"><button class="btn ${done?'pri':''}" data-a="next">${done?'Next':'Skip'}${IC.next}Space</button></div>`;},
 act(a,v){if(a==='sso'&&this.ans===null){this.ans=this.opts[+v];award(this.ans===this.snd.key);render();}else if(a==='ssn'){ST.ss=+v;if(this.ans===null)this.opts=shuffle([this.snd.key,...distract(this.cur,this.snd,ST.ss-1,this.keys)]);render();}},
 space(){if(this.next())render();},key(k){if(/^[1-4]$/.test(k)&&+k<=this.opts.length){this.act('sso',String(+k-1));return true;}return false;}})};
function editor(){modal(`<div style="width:1300px"><h2>Paste your words</h2><p style="font-size:26px">One word per line. Free demo: up to 12 words. Optional: <b>sh-i-p</b> marks sound chunks, <b>cat = 猫</b> adds a meaning shown after each answer.</p>
 <textarea id="lt" style="margin-top:14px;height:430px" placeholder="ship&#10;sh-i-p&#10;cat = 猫">${esc(ST.text)}</textarea><div class="lp" id="lp"></div><div class="mrow"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="eduse">Use these words</button></div></div>`,'eduse');
 const t=$('#lt');t.addEventListener('input',edLive);t.addEventListener('keydown',ev=>ev.stopPropagation());edLive();}
function edLive(){const t=$('#lt');if(!t)return;const r=parseList(t.value,12);const ig=[];if(r.ig.empty)ig.push(r.ig.empty+' empty');if(r.ig.dup)ig.push(r.ig.dup+' duplicate');if(r.ig.comment)ig.push(r.ig.comment+' comment');
 let h=`${r.items.length} word${r.items.length===1?'':'s'}${ig.length?' · ignored: '+ig.join(', '):''}`;if(r.cut)h+=`<br><span class="warn">Free demo: 12 words. The full version takes 100 per list and includes 452 built-in words.</span>`;else if(r.items.length<5)h+=`<br><span class="warn">Choose at least 5 words</span>`;$('#lp').innerHTML=h;}
function act(a,v){
 if(a==='close'){closeModal();return;}if(a==='home'){closeModal();drawStart();return;}
 if(a==='unit'||a==='stage'){const ids=a==='unit'?[v]:UNITS.filter(u=>u.st===+v).map(u=>u.id);const open=ids.filter(x=>OPEN_U.has(x));if(!open.length){toast('Full version: all 22 units');return;}if(ST.custom){ST.custom=null;ST.units=new Set();}
  const all=open.every(x=>ST.units.has(x));open.forEach(x=>all?ST.units.delete(x):ST.units.add(x));store('units',[...ST.units]);drawStart();return;}
 if(a==='builtin'){ST.custom=null;drawStart();return;}
 if(a==='teams'){ST.teams=Math.max(2,Math.min(6,ST.teams+(+v)));if(ST.turn>=ST.teams)ST.turn=0;saveTeams();drawStart();return;}
 if(a==='tset'){const i=TIMES.indexOf(ST.timer);ST.timer=TIMES[Math.max(0,Math.min(TIMES.length-1,(i<0?4:i)+(+v)))];saveTeams();tmReset();drawStart();return;}
 if(a==='game'){startGame(v);return;}if(a==='lists'){editor();return;}
 if(a==='eduse'){const t=$('#lt').value;ST.text=t;const r=parseList(t,12);if(r.items.length<5){toast('Choose at least 5 words');return;}ST.custom={items:r.items};closeModal();drawStart();if(r.cut)toast('Free demo: 12 words. The full version takes 100 per list and includes 452 built-in words.',4000);return;}
 if(ST.screen!=='game'||!G)return;
 if(a==='help'){showHelp();return;}
 if(a==='restart'){modal(`<h2>Restart?</h2><p>Scores go back to 0, the timer resets and all words are shuffled again.</p><div class="mrow"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="dorestart">${IC.restart}Restart</button></div>`,'dorestart');return;}
 if(a==='dorestart'){closeModal();for(let i=0;i<6;i++)ST.scores[i]=0;ST.turn=0;G.init();tmReset();render();toast('New game: scores reset');return;}
 if(a==='fs'){fs();return;}if(a==='timer'){tmToggle();return;}
 if(a==='score'){const[i,d]=v.split(',').map(Number);ST.scores[i]=Math.max(0,ST.scores[i]+d);render();return;}
 if(a==='turn'){ST.turn=+v;render();return;}
 if(a==='reshuffle'){closeModal();G.deck.q=shuffle(G.deck.all.slice());G.next(true);render();return;}
 if(a==='next'){G.space();return;}G.act(a,v);}
function showHelp(){const g=GAMES[G.id];modal(`<div style="width:1200px"><h2>${g.name}</h2>${g.help}<div class="keys">${g.keys.concat([['F','full screen'],['T','start / pause the timer'],['?','this help'],['Esc','close']]).map(k=>`<kbd>${k[0]}</kbd><span>${k[1]}</span>`).join('')}</div><div class="mrow"><button class="btn pri" data-a="close">Got it</button></div></div>`,'close');}
stage.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;ac();act(b.dataset.a,b.dataset.v);if(b.blur)b.blur();});
stage.addEventListener('dblclick',e=>{const b=e.target.closest('[data-team]');if(!b)return;const i=+b.dataset.team;
 modal(`<div style="width:900px"><h2>Rename team</h2><input type="text" id="tn" maxlength="16" value="${esc(ST.names[i])}"><div class="mrow"><button class="btn" data-a="close">Cancel</button><button class="btn pri" id="tnok">Save</button></div></div>`,'tnok');
 const inp=$('#tn');inp.focus();inp.select();const ok=()=>{const v=inp.value.trim();if(v)ST.names[i]=v.slice(0,16);saveTeams();closeModal();render();};$('#tnok').onclick=ok;inp.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter')ok();if(ev.key==='Escape')closeModal();});});
window.addEventListener('keydown',e=>{const tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA')return;const k=e.key;
 if(k==='Escape'){closeModal();return;}if(modalOn){if(k===' '||k==='Enter'){e.preventDefault();const p=modalOn.primary;if(p==='tnok')$('#tnok').click();else if(p!=='eduse')act(p);}return;}
 if(k==='f'||k==='F'){fs();return;}if(ST.screen!=='game'||!G)return;if(k==='?'||(k==='/'&&e.shiftKey)){showHelp();return;}
 if(k===' '){e.preventDefault();ac();G.space();return;}if(k==='t'||k==='T'){tmToggle();return;}if(G.key&&G.key(k.length===1?k.toLowerCase():k))e.preventDefault();});
load();fit();drawStart();
</script></body></html>
