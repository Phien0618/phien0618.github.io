<style id="engine-css">
/* ===== Printed pages: black #000 + one gray #D6D6D6 only =====
   Paper size: the #pagerule style above is switched by the Letter/A4 toggle between
   @page{size:8.5in 11in;margin:0.5in 0.5in 0.5in 0.75in} and @page{size:210mm 297mm;margin:12mm 12mm 12mm 19mm} */
.paper{--gray:#D6D6D6;--pitch:9mm;--lp:10mm;--fs-h1:24pt;--fs-tag:14pt;--fs-help:11pt;--fs-lab:11pt;--fs-task:14pt;--fs-body:11pt;--fs-small:9pt;--fs-foot:8.5pt}
.paper.lg{--pitch:11mm;--lp:12mm;--fs-h1:28pt;--fs-tag:16pt;--fs-help:14pt;--fs-lab:14pt;--fs-task:17pt;--fs-body:14pt;--fs-small:11pt;--fs-foot:10pt}
.paper,.paper *{box-sizing:border-box;margin:0;padding:0}
.paper{width:8.5in;height:11in;background:#fff;color:#000;padding:.5in .5in .5in .75in;overflow:hidden}
.paper.a4{width:210mm;height:297mm;padding:12mm 12mm 12mm 19mm}
.sheet{height:9.98in;display:flex;flex-direction:column;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:var(--fs-body);line-height:1.25;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a4 .sheet{height:272.5mm}
.sheet .ic{width:5.5mm;height:5.5mm;flex:none}
.sheet .ic.xs{width:3.2mm;height:3.2mm;vertical-align:-.5mm}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:4mm;padding-bottom:2.5mm;border-bottom:1pt solid #000;flex:none}
.hdr h1{font-size:var(--fs-h1);line-height:1;font-weight:800;letter-spacing:-.01em}
.hdr .sub{font-size:var(--fs-help);margin-top:1.8mm}
.daytag{border:1pt solid #000;border-radius:99px;padding:1.2mm 4mm;font-size:var(--fs-tag);font-weight:800;white-space:nowrap;flex:none}
.daytag small{font-weight:400;font-size:var(--fs-small);margin-left:1.5mm}
.label{font-size:var(--fs-lab);font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:1.8mm;flex:none}
.box{border:1pt solid #000;border-radius:3mm;padding:3.5mm}
.cb{width:5mm;height:5mm;border:1pt solid #000;border-radius:1mm;flex:none;display:inline-block;background:#fff}
.badge{width:9mm;height:9mm;border:1.2pt solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14pt;flex:none}
.line{border-bottom:.75pt solid var(--gray);height:var(--pitch);display:flex;align-items:flex-end;padding-bottom:1.5mm;flex:none;min-width:0;white-space:nowrap;overflow:hidden}
.line>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.typed{font-weight:700}
.tl{border-bottom:.75pt solid var(--gray);min-height:var(--pitch);padding:1mm 0 1.5mm;display:flex;align-items:flex-end;font-size:var(--fs-task);line-height:1.2;flex:none;overflow-wrap:anywhere}
/* Daily Top 3 */
.tasks{flex:1;display:flex;flex-direction:column;gap:3.5mm;margin-top:4mm;min-height:0}
.task{flex:1;display:flex;gap:4mm;padding:3mm 3.5mm;min-height:0;overflow:hidden}
.task .body{flex:1;display:flex;flex-direction:column;min-width:0}
.step{display:flex;align-items:flex-end;gap:2mm;margin-top:auto}
.step .line{flex:1}
.stl{display:flex;align-items:center;gap:1mm;white-space:nowrap;padding-bottom:1.5mm;flex:none}
.sheet .stl .ic{width:3.8mm;height:3.8mm}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2mm;width:10mm;flex:none}
.side .cb{width:7mm;height:7mm}
.side small{font-size:var(--fs-small)}
.one{display:flex;align-items:flex-end;gap:2mm;margin-top:3.5mm;font-weight:800;flex:none}
.one .line{flex:1}
.one>span{padding-bottom:1.5mm;white-space:nowrap}
.sheet .one .ic{margin-bottom:1mm}
.blocks{display:grid;grid-template-columns:1fr 1fr 1fr;height:66mm;margin-top:4mm;padding:0;flex:none}
.a4 .blocks{height:76mm}
.blk{padding:3mm 3.5mm;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.blk+.blk{border-left:.75pt solid var(--gray)}
.blk .label{margin-bottom:2.5mm}
.it{display:flex;align-items:flex-end;gap:2mm;flex:none}
.it .cb{margin-bottom:1.2mm}
.it .line{flex:1;height:8.5mm}
.lg .it .line{height:10mm}
.chip{display:flex;align-items:center;gap:2mm;background:var(--gray);border-radius:1.5mm;padding:1mm 2mm;margin-bottom:1.5mm;flex:none;min-width:0}
.chip .ct{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.sheet .chip .rt{width:3.6mm;height:3.6mm;flex:none}
.chip.more{font-weight:700}
.carry{background:var(--gray);border:1pt dashed #000;border-radius:3mm;padding:2.5mm 4mm 3mm;margin-top:4mm;flex:none}
.carry .label{margin-bottom:.5mm}
.carry .lab2{font-weight:400;letter-spacing:0;text-transform:none;font-size:var(--fs-help);margin-left:2mm}
.carry .row{display:flex;align-items:flex-end;gap:3mm}
.carry .row .cb{margin-bottom:1.2mm}
.carry .row .line{flex:1;border-bottom:.5pt solid #000}
.note{border-left:2pt solid #000;padding-left:3mm;font-size:var(--fs-help);margin-top:4mm;flex:none}
.ftr{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6mm;font-size:var(--fs-foot);padding-top:2.5mm;flex:none;white-space:nowrap}
.ftr .l{display:flex;align-items:center;gap:1.5mm}
.sheet .ftr .mk{width:4mm;height:4mm}
/* Weekly */
.wk3{margin-top:4mm;flex:none;padding:3mm 3.5mm}
.wk3 .r{display:flex;align-items:flex-end;gap:3mm}
.wk3 .n2{font-weight:800;width:5mm;padding-bottom:1.5mm;flex:none}
.wk3 .r .line{flex:1}
.wk3 .r .cb{margin-bottom:1.2mm}
.week{flex:1;display:flex;flex-direction:column;margin-top:4mm;border:1pt solid #000;border-radius:3mm;min-height:0;overflow:hidden}
.wrow{flex:1;display:grid;grid-template-columns:22mm minmax(0,1fr) 54mm;min-height:0;overflow:hidden}
.wrow+.wrow{border-top:.75pt solid var(--gray)}
.wday{padding:2.5mm 3mm;border-right:.75pt solid var(--gray);display:flex;flex-direction:column;gap:.5mm}
.wday b{font-size:var(--fs-task)}
.wday small{font-size:var(--fs-small)}
.wmid{padding:0 3mm 1.5mm;display:flex;flex-direction:column;justify-content:space-evenly;min-width:0}
.wmid .it .line{height:7mm}
.lg .wmid .it .line{height:7.5mm}
.wrt{padding:2.5mm 3mm;border-left:.75pt solid var(--gray);overflow:hidden;min-width:0}
.wrt div{display:flex;gap:1.2mm;align-items:center;white-space:nowrap;overflow:hidden}
.wrt div span{overflow:hidden;text-overflow:ellipsis}
.wrt .more{font-weight:700}
/* Dopamine menu */
.menu{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4mm;margin-top:4mm;min-height:0}
.course{display:flex;flex-direction:column;min-height:0;overflow:hidden;min-width:0}
.course .help,.dcol .help{font-size:var(--fs-help);margin:1mm 0 1mm;flex:none}
.mi{display:flex;align-items:flex-end;gap:2mm;flex:none}
.mi .line{flex:1;justify-content:space-between;gap:2mm}
.mi .dur{font-weight:400;flex:none}
/* Habit tracker */
.htab{flex:1;display:flex;flex-direction:column;margin-top:3mm;border:1pt solid #000;border-radius:2mm;overflow:hidden;min-height:0}
.hrow{flex:1;display:grid;grid-template-columns:11mm repeat(8,minmax(0,1fr));min-height:0}
.hrow+.hrow{border-top:.75pt solid var(--gray)}
.hrow.hhead{flex:none;height:17mm;border-bottom:1pt solid #000}
.hrow.hhead+.hrow{border-top:0}
.hrow>div{border-left:.75pt solid var(--gray);display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.hrow>div:first-child{border-left:0;font-weight:700}
.hn span{font-weight:700;text-align:center;padding:0 1mm;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* Low-energy */
.ltab{flex:1;display:flex;flex-direction:column;margin-top:4mm;min-height:0;overflow:hidden}
.lrow{display:grid;grid-template-columns:7mm 60mm minmax(0,1fr);align-items:end;gap:0 3mm;height:var(--lp);flex:none;border-bottom:.75pt solid var(--gray);padding-bottom:1.5mm}
.lrow>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .cb{margin-bottom:-.3mm}
.lhead{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:var(--fs-lab);border-bottom:1pt solid #000;height:9mm}
/* Brain dump */
.dump{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3mm;margin-top:4mm;min-height:0}
.dcol{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:3mm}
.di{display:flex;align-items:flex-end;gap:2mm;flex:none;min-height:var(--pitch);border-bottom:.75pt solid var(--gray);padding-bottom:1.5mm}
.di .tx{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere;line-height:1.2}
@media print{
  html,body{background:#fff!important}
  .paper{width:auto!important;height:auto!important;padding:0!important;box-shadow:none!important;overflow:visible!important;display:block!important;break-after:page;page-break-after:always}
  .paper:last-child{break-after:auto;page-break-after:auto}
}
</style>

var WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var WDL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var WD1=['M','T','W','T','F','S','S'];
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var BLOCKS=[['m','Morning','sun'],['a','Afternoon','half'],['e','Evening','moon']];
var COURSES=[['app','Appetizers','Quick boosts, 2–5 min','cup'],['main','Mains','Bigger, 20–60 min','bowl'],['side','Sides','Pair with a boring task','plus'],['dess','Desserts','Fun, but set a timer','ice']];
var LIM={routines:12,habits:8,menu:8,dump:40,extra:6};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ic(id,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#'+id+'"/></svg>';}
function rep(s,n){var o='';for(var i=0;i<n;i++)o+=s;return o;}
function tr(s){return String(s||'').trim();}

function exampleMenu(){
  function m(a){return a.map(function(x){return {t:x[0],d:x[1]};});}
  return {
    app:m([['Stretch for 2 minutes','2 min'],['One favorite song, loud','4 min'],['Step outside for fresh air','3 min'],['Make a cup of tea','5 min'],['Doodle on scrap paper','5 min'],['Text a friend a meme','2 min']]),
    main:m([['Walk around the block','20 min'],['Cook a simple meal','40 min'],['Play an instrument','30 min'],['Work on a craft project','45 min'],['Bike ride','30 min'],['Call a friend','30 min']]),
    side:m([['Podcast while folding laundry',''],['Lo-fi playlist on',''],['Fidget toy in one hand',''],['Body doubling on a video call',''],['Fancy drink at the desk',''],['Audiobook while cleaning','']]),
    dess:m([['One episode of a show','25 min'],['Social media, timer on','10 min'],['One round of a video game','20 min'],['Read a comic','15 min'],['One YouTube video','15 min'],['Window-shop online','10 min']])
  };
}
function blankDay(){return {t:['','',''],s:['','',''],one:''};}
function defaults(examples){
  var s={v:1,tab:'top3',paper:'letter',size:'normal',
    top3:{pages:7,start:'',day1:0,extras:false,days:[]},
    routines:[],dump:{items:[]},
    weekly:{three:['','',''],notes:['','','','','','',''],start:''},
    menu:{app:[],main:[],side:[],dess:[]},
    habits:{month:'',list:[]},
    low:{mins:{},extra:[]}};
  if(examples){
    s.routines=[{id:'r1',name:'Meds + water',b:'m',d:[1,1,1,1,1,1,1]},{id:'r2',name:'9:00 team stand-up',b:'m',d:[1,1,1,1,1,0,0]},{id:'r3',name:'Walk the dog (20 min)',b:'a',d:[1,1,1,1,1,1,1]},{id:'r4',name:'Phone on charger',b:'e',d:[1,1,1,1,1,1,1]}];
    s.menu=exampleMenu();
  }
  return s;
}
function norm(o){
  var s=defaults(false);
  if(!o||typeof o!=='object')return s;
  function str(v,max){return typeof v==='string'?v.slice(0,max):'';}
  function arr(v){return Array.isArray(v)?v:[];}
  if(['top3','dump','weekly','menu','habits','low'].indexOf(o.tab)>=0)s.tab=o.tab;
  s.paper=o.paper==='a4'?'a4':'letter';
  s.size=o.size==='large'?'large':'normal';
  var t=o.top3||{};
  s.top3.pages=[1,7,14,30].indexOf(+t.pages)>=0?+t.pages:7;
  s.top3.start=/^\d{4}-\d{2}-\d{2}$/.test(t.start||'')?t.start:'';
  s.top3.day1=Math.max(0,Math.min(6,parseInt(t.day1,10)||0));
  s.top3.extras=!!t.extras;
  arr(t.days).slice(0,30).forEach(function(d,i){d=d||{};s.top3.days[i]={t:[0,1,2].map(function(k){return str(arr(d.t)[k],90);}),s:[0,1,2].map(function(k){return str(arr(d.s)[k],60);}),one:str(d.one,60)};});
  var seen={};
  arr(o.routines).slice(0,LIM.routines).forEach(function(r,i){r=r||{};var id=str(r.id,24)||('r'+i);if(seen[id])id=id+'_'+i;seen[id]=1;
    s.routines.push({id:id,name:str(r.name,28),b:['m','a','e'].indexOf(r.b)>=0?r.b:'m',d:[0,1,2,3,4,5,6].map(function(w){return arr(r.d)[w]?1:0;})});});
  arr((o.dump||{}).items).slice(0,LIM.dump).forEach(function(it){it=it||{};s.dump.items.push({t:str(it.t,60),b:['today','later','drop'].indexOf(it.b)>=0?it.b:'later'});});
  var w=o.weekly||{};
  s.weekly.three=[0,1,2].map(function(k){return str(arr(w.three)[k],60);});
  s.weekly.notes=[0,1,2,3,4,5,6].map(function(k){return str(arr(w.notes)[k],40);});
  s.weekly.start=/^\d{4}-\d{2}-\d{2}$/.test(w.start||'')?w.start:'';
  var m=o.menu||{};
  COURSES.forEach(function(c){s.menu[c[0]]=arr(m[c[0]]).slice(0,LIM.menu).map(function(x){x=x||{};return {t:str(x.t,34),d:str(x.d,12)};});});
  var h=o.habits||{};
  s.habits.month=str(h.month,20);
  s.habits.list=arr(h.list).slice(0,LIM.habits).map(function(x){return str(x,24);});
  var l=o.low||{};
  if(l.mins&&typeof l.mins==='object')Object.keys(l.mins).forEach(function(k){s.low.mins[k]=str(l.mins[k],50);});
  s.low.extra=arr(l.extra).slice(0,LIM.extra).map(function(x){x=x||{};return {r:str(x.r,28),m:str(x.m,50)};});
  return s;
}
function getDay(s,i){if(!s.top3.days[i])s.top3.days[i]=blankDay();return s.top3.days[i];}
function parseDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return null;var p=v.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function wdOf(d){return (d.getDay()+6)%7;}
function dmy(d){return d.getDate()+' '+MO[d.getMonth()];}
function dayInfo(s,i,n){
  var sd=parseDate(s.top3.start);
  if(sd){var d=addDays(sd,i),wd=wdOf(d),lab=WD[wd]+' '+dmy(d);return {wd:wd,tag:lab,small:'',foot:lab,form:WDL[wd]+' '+dmy(d)};}
  var w=((+s.top3.day1||0)+i)%7;
  return {wd:w,tag:'Day '+(i+1),small:'of '+n+' · '+WD[w],foot:'Day '+(i+1),form:'Day '+(i+1)+' of '+n+' · '+WDL[w]};
}
function routinesFor(s,wd,b){return s.routines.filter(function(r){return tr(r.name)&&r.d[wd]&&(!b||r.b===b);});}
function sheet(s,inner,footL){
  return '<div class="paper '+(s.paper==='a4'?'a4':'letter')+(s.size==='large'?' lg':'')+'"><div class="sheet">'+inner+
    '<div class="ftr"><div class="l">'+ic('mark','mk')+footL+'</div><div>ADHD Daily Plan Maker</div></div></div></div>';
}
function hdr(title,sub,tag,small){
  return '<div class="hdr"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div>'+(tag?'<div class="daytag">'+esc(tag)+(small?'<small>'+esc(small)+'</small>':'')+'</div>':'')+'</div>';
}
function ln(text,cls){text=tr(text);return '<div class="line'+(text?' typed':'')+(cls?' '+cls:'')+'">'+(text?'<span>'+esc(text)+'</span>':'')+'</div>';}
function chip(name){return '<div class="chip"><span class="cb"></span><span class="ct">'+esc(tr(name))+'</span>'+ic('loop','rt')+'</div>';}

function pgDaily(s,i,n){
  var L=s.size==='large',A4=s.paper==='a4',di=dayInfo(s,i,n),d=getDay(s,i),h='',any=false;
  h+=hdr('Daily Top 3','Pick three. Anything else is a bonus.',di.tag,di.small);
  h+='<div class="tasks">';
  for(var k=0;k<3;k++){
    var t=tr(d.t[k]),st=tr(d.s[k]),long=t.length>(L?38:48);
    h+='<div class="box task"><div class="badge">'+(k+1)+'</div><div class="body">'+
      (t?'<div class="tl typed">'+esc(t)+'</div>':'<div class="line"></div>')+
      ((L||long)?'':'<div class="line"></div>')+
      '<div class="step"><span class="stl">'+ic('hook')+'first tiny step:</span>'+ln(st)+'</div></div>'+
      '<div class="side"><span class="cb"></span><small>done</small></div></div>';
  }
  h+='</div>';
  h+='<div class="one">'+ic('star')+'<span>If I only do one:</span>'+ln(d.one)+'</div>';
  var cap=(A4?6:5)-(L?1:0);
  h+='<div class="box blocks">';
  BLOCKS.forEach(function(b){
    var rs=routinesFor(s,di.wd,b[0]),used=0,chips='',j=0;
    while(j<rs.length){
      var w=tr(rs[j].name).length>(L?15:20)?1.5:1,rest=rs.length-j-1;
      if(used+w>cap||(rest>0&&used+w+1>cap))break;
      chips+=chip(rs[j].name);used+=w;j++;
    }
    if(j<rs.length){chips+='<div class="chip more">+'+(rs.length-j)+' more routine'+(rs.length-j>1?'s':'')+'</div>';used+=1;}
    if(rs.length)any=true;
    h+='<div class="blk"><div class="label">'+ic(b[2])+b[1]+'</div>'+chips+rep('<div class="it"><span class="cb"></span><div class="line"></div></div>',Math.max(0,Math.floor(cap-used)))+'</div>';
  });
  h+='</div>';
  h+='<div class="carry"><div class="label">'+ic('arrow')+'Carry forward<span class="lab2">Not done? Park it here. No guilt.</span></div>'+
    rep('<div class="row"><span class="cb"></span><div class="line"></div><span class="cb"></span><div class="line"></div></div>',2)+'</div>';
  return sheet(s,h,'Daily Top 3 · '+esc(di.foot)+(any?' · '+ic('loop','xs')+' = your saved routine':''));
}
function weekDays(start){
  var sd=parseDate(start),out=[];
  for(var i=0;i<7;i++){
    if(sd){var d=addDays(sd,i);out.push({wd:wdOf(d),lab:WD[wdOf(d)],sub:dmy(d)});}
    else out.push({wd:i,lab:WD[i],sub:''});
  }
  return out;
}
function pgWeekly(s){
  var w=s.weekly,L=s.size==='large',days=weekDays(w.start),h='',cap=L?3:4;
  var tag=w.start?'Week of '+days[0].sub:'';
  h+=hdr('Weekly Plan','Three for the week. One small thing a day is plenty.',tag,'');
  h+='<div class="box wk3"><div class="label">'+ic('star')+'This week’s 3</div>';
  for(var k=0;k<3;k++)h+='<div class="r"><span class="n2">'+(k+1)+'</span>'+ln(w.three[k])+'<span class="cb"></span></div>';
  h+='</div><div class="week">';
  days.forEach(function(dy,i){
    var rs=routinesFor(s,dy.wd),rt='',j;
    var showN=rs.length>cap?cap-1:rs.length;
    for(j=0;j<showN;j++)rt+='<div>'+ic('loop','xs')+'<span>'+esc(tr(rs[j].name))+'</span></div>';
    if(rs.length>showN)rt+='<div class="more">+'+(rs.length-showN)+' more</div>';
    h+='<div class="wrow"><div class="wday"><b>'+dy.lab+'</b>'+(dy.sub?'<small>'+dy.sub+'</small>':'')+'</div><div class="wmid">'+
      '<div class="it"><span class="cb"></span>'+ln(w.notes[i])+'</div>'+rep('<div class="it"><span class="cb"></span><div class="line"></div></div>',2)+
      '</div><div class="wrt">'+rt+'</div></div>';
  });
  h+='</div>';
  return sheet(s,h,'Weekly Plan'+(tag?' · '+esc(tag):'')+(s.routines.some(function(r){return tr(r.name);})?' · '+ic('loop','xs')+' = your saved routine':''));
}
function pgMenu(s){
  var L=s.size==='large',A4=s.paper==='a4',rows=L?(A4?9:8):(A4?11:10),h='';
  h+=hdr('Dopamine Menu','Low-effort ways to get going. Pick one, set a timer.','','');
  h+='<div class="menu">';
  COURSES.forEach(function(c){
    var items=(s.menu[c[0]]||[]).filter(function(x){return tr(x.t);});
    h+='<div class="box course"><div class="label">'+ic(c[3])+c[1]+'</div><div class="help">'+c[2]+'</div>';
    items.forEach(function(x){h+='<div class="mi"><div class="line typed"><span>'+esc(tr(x.t))+'</span><span class="dur">'+esc(tr(x.d))+'</span></div></div>';});
    h+=rep('<div class="mi"><div class="line"></div></div>',Math.max(0,rows-items.length))+'</div>';
  });
  h+='</div>';
  return sheet(s,h,'Dopamine Menu');
}
function pgHabits(s){
  var hs=s.habits.list.slice(0,8),month=tr(s.habits.month),h='',i,k;
  while(hs.length<8)hs.push('');
  h+=hdr('Habit Tracker','Tick the days you did it. One missed day is normal.',month,'');
  h+='<div class="note"><b>Never miss twice.</b> Missed yesterday? Do the smallest version today.</div>';
  h+='<div class="htab"><div class="hrow hhead"><div>Day</div>';
  for(k=0;k<8;k++)h+='<div class="hn"><span>'+esc(tr(hs[k]))+'</span></div>';
  h+='</div>';
  for(i=1;i<=31;i++)h+='<div class="hrow"><div>'+i+'</div>'+rep('<div></div>',8)+'</div>';
  h+='</div>';
  return sheet(s,h,'Habit Tracker'+(month?' · '+esc(month):''));
}
function lowRows(s){
  var out=[];
  s.routines.forEach(function(r){if(tr(r.name))out.push({r:r.name,m:s.low.mins[r.id]||''});});
  s.low.extra.forEach(function(x){if(tr(x.r)||tr(x.m))out.push(x);});
  return out;
}
function pgLow(s){
  var L=s.size==='large',A4=s.paper==='a4',N=L?(A4?18:16):(A4?22:20),rows=lowRows(s).slice(0,N),h='';
  h+=hdr('Low-Energy Day','Heavy day? Do the smallest version. It still counts.','','');
  h+='<div class="note"><b>Minimum still counts.</b> Tick it and rest. Tomorrow can be a normal day.</div>';
  h+='<div class="ltab"><div class="lrow lhead"><span></span><div>Routine</div><div>Minimum version</div></div>';
  rows.forEach(function(x){h+='<div class="lrow"><span class="cb"></span><div class="typed">'+esc(tr(x.r))+'</div><div class="typed">'+esc(tr(x.m))+'</div></div>';});
  h+=rep('<div class="lrow"><span class="cb"></span><div></div><div></div></div>',N-rows.length)+'</div>';
  return sheet(s,h,'Low-Energy Day');
}
function pgDump(s){
  var L=s.size==='large',A4=s.paper==='a4',N=L?(A4?18:17):(A4?23:21),per=L?17:22,h='';
  var cols={today:[],later:[],drop:[]};
  s.dump.items.forEach(function(it){if(tr(it.t))cols[it.b||'later'].push(tr(it.t));});
  h+=hdr('Brain Dump','Get it all out of your head. Then sort it.','','');
  h+='<div class="note"><b>Today</b> = your Top 3 (max 3). <b>Later</b> = not now, not lost. <b>Drop</b> = let it go.</div>';
  h+='<div class="dump">';
  [['today','Today','Max 3. They go on your Daily Top 3.'],['later','Later','Not now, not lost.'],['drop','Drop','Let it go. No guilt.']].forEach(function(c){

    case 'pages':st.top3.pages=+v;view.top3=Math.min(view.top3,+v-1);break;
    case 'paper':st.paper=v==='a4'?'a4':'letter';break;
    case 'size':st.size=v==='large'?'large':'normal';break;
    case 'dprev':view.top3=Math.max(0,editDay()-1);break;
    case 'dnext':view.top3=Math.min(st.top3.pages-1,editDay()+1);break;
    case 'pgprev':view[st.tab]=Math.max(0,(view[st.tab]||0)-1);break;
    case 'pgnext':view[st.tab]=(view[st.tab]||0)+1;break;
    case 'pggo':view[st.tab]=i;break;
    case 'radd':
      if(st.routines.length>=LIM.routines){toast('12 routines is the max.');return;}
      st.routines.push({id:newId(),name:'',b:'m',d:[1,1,1,1,1,1,1]});save();renderForm();renderPreview();focusLast('[data-f=rname]');return;
    case 'rdel':st.routines=st.routines.filter(function(r){return r.id!==id;});delete st.low.mins[id];break;
    case 'dadd':
      var lines=draftDump.split(/\r?\n/).map(tr).filter(Boolean),room=LIM.dump-st.dump.items.length;
      if(!lines.length){toast('Type or paste some lines first.');return;}
      lines.slice(0,room).forEach(function(l){st.dump.items.push({t:l.slice(0,60),b:'later'});});
      if(lines.length>room)toast('Added '+room+'. 40 lines is the max.');
      draftDump='';break;
    case 'dbin':if(st.dump.items[i])st.dump.items[i].b=v;break;
    case 'ddel':st.dump.items.splice(i,1);break;
    case 'dclear':if(!confirm('Empty the whole brain dump list?'))return;st.dump.items=[];break;
    case 'dsend':
      var td=st.dump.items.filter(function(x){return x.b==='today'&&tr(x.t);}).slice(0,3).map(function(x){return tr(x.t);});
      day=getDay(st,editDay());var slots=[0,1,2].filter(function(q){return !tr(day.t[q]);}),label=dayInfo(st,editDay(),st.top3.pages).foot;
      if(slots.length<td.length){
        if(!confirm(label+' already has things on it. Replace them with your Today lines?'))return;
        for(k=0;k<3;k++){day.t[k]=td[k]||'';day.s[k]='';}
      }else{td.forEach(function(t,q){day.t[slots[q]]=t;});}
      save();toast('Sent '+td.length+' to Daily Top 3 · '+label);renderForm();renderPreview();return;
    case 'madd':list=st.menu[c];if(list.length>=LIM.menu){toast('8 is the max for one course.');return;}list.push({t:'',d:''});save();renderForm();renderPreview();focusLast('[data-f=mi][data-c='+c+']');return;
    case 'mdel':st.menu[c].splice(i,1);break;
    case 'mreset':if(!confirm('Put back the 24 example items? This replaces your current menu.'))return;st.menu=exampleMenu();break;
    case 'hadd':if(st.habits.list.length>=LIM.habits){toast('8 habits is the max.');return;}st.habits.list.push('');save();renderForm();renderPreview();focusLast('[data-f=hname]');return;
    case 'hdel':st.habits.list.splice(i,1);break;
    case 'ladd':if(st.low.extra.length>=LIM.extra){toast('6 extra rows is the max.');return;}st.low.extra.push({r:'',m:''});save();renderForm();renderPreview();focusLast('[data-f=lxr]');return;
    case 'ldel':st.low.extra.splice(i,1);break;
    case 'print':renderPreview();setTimeout(function(){window.print();},60);return;
    case 'export':doExport();return;
    case 'import':$('importFile').click();return;
    case 'clear':
      if(!confirm('Clear all? This deletes every task, routine, menu item and habit saved in this browser. Export a backup first if you want to keep them.'))return;
      st=defaults(false);view={top3:0,dump:0,weekly:0,menu:0,habits:0,low:0};draftDump='';saveNow();renderAll();toast('Cleared. Fresh start.');return;
    default:return;
  }
  save();renderForm();renderPreview();
});
function setPageRule(){
  $('pagerule').textContent=st.paper==='a4'?'@page{size:210mm 297mm;margin:12mm 12mm 12mm 19mm}':'@page{size:8.5in 11in;margin:0.5in 0.5in 0.5in 0.75in}';
}
var _rp=renderPreview;renderPreview=function(){setPageRule();_rp();};
window.addEventListener('resize',fit);
window.addEventListener('beforeprint',function(){setPageRule();});
st=load();
renderAll();
try{localStorage.setItem(KEY+'.test','1');localStorage.removeItem(KEY+'.test');setSaved(true);}catch(e){setSaved(false);}
})();
</script>
</body>
