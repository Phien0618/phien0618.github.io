const picKey=w=>String(w||'').toLowerCase().trim().replace(/^(a|an|the)\s+/,'').replace(/s$/,'');
const picFor=w=>{const k=String(w||'').toLowerCase().trim().replace(/^(a|an|the)\s+/,'');return PICS[k]||PICS[picKey(w)]||null};
const G={id:'03',demoList:'Animals',
opts:'<label>Tiles<select id="oG"><option value="3">3 × 3</option><option value="4" selected>4 × 4</option><option value="5">5 × 5</option><option value="6">6 × 6</option></select></label><label class="ck"><input type="checkbox" id="oPic" checked>Use the 20 built-in pictures when a word matches</label><label class="ck"><input type="checkbox" id="oM" checked>Show the meaning with the word</label><p class="fmt">Built-in pictures: cat, dog, elephant, giraffe, lion, monkey, rabbit, horse, cow, duck, snake, penguin, tiger, frog, bear, apple, banana, carrot, egg, fish. Other words are hidden as big text. Your own picture: drag it onto the board or click <b>Picture…</b> (read on this computer only).</p>',
help:'<p>A picture (or the word) is hidden under numbered tiles. Students call a number, the tile opens, and teams try to guess.</p><p>20 original drawings are built in: cat, dog, elephant, giraffe, lion, monkey, rabbit, horse, cow, duck, snake, penguin, tiger, frog, bear, apple, banana, carrot, egg, fish. When a word in your list matches, its picture is hidden; the word appears when all tiles are open. Other words are hidden as big text.</p><ol><li>Click a tile, or press <b>Space</b> to open a random one.</li><li>The first team to guess correctly gets the points (use the score strip).</li><li><b>Reveal all</b> shows everything. <b>Next word</b> hides a new word.</li><li>To use a picture: drag an image file from your computer onto the board, or click <b>Picture…</b>. It is only shown on this computer, never uploaded.</li></ol>',
keys:[['Space','Open a random tile (next word when all are open)'],['A','Reveal all'],['N','Next word']],
order:[],idx:0,img:null,n:4,
init(){$('#bOne').onclick=()=>this.openOne();$('#bAll').onclick=()=>this.all();$('#bNext').onclick=()=>this.next();$('#bPic').onclick=()=>$('#pic').click();$('#bClr').onclick=()=>{this.img=null;this.content()};
$('#pic').onchange=e=>{const f=e.target.files[0];if(f)this.loadImg(f);e.target.value=''};
const st=$('#stage');st.addEventListener('dragover',e=>{e.preventDefault();st.classList.add('drag')});st.addEventListener('dragleave',()=>st.classList.remove('drag'));
st.addEventListener('drop',e=>{e.preventDefault();st.classList.remove('drag');const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)this.loadImg(f)});
$('#tiles').onclick=e=>{const t=e.target.closest('.tile');if(t)this.openTile(t)}},
loadImg(f){if(!/^image\//.test(f.type)){toast('Please use an image file (JPG, PNG, GIF, WebP).');return}const r=new FileReader();r.onload=()=>{this.img=r.result;this.tiles();this.content();toast('Picture loaded on this computer only')};r.readAsDataURL(f)},
start(p){this.n=+$('#oG').value;this.order=shuffle(p.items);this.idx=0;this.img=null;this.round()},
restart(){this.start(P)},
size(){const a=$('#sa'),st=$('#stage');let w=a.clientWidth,h=a.clientHeight;if(w/h>16/9)w=h*16/9;else h=w*9/16;st.style.width=Math.floor(w)+'px';st.style.height=Math.floor(h)+'px'},
resize(){this.size();this.content()},
round(){this.size();this.tiles();this.content()},
cur(){return this.order[this.idx]},
content(){const c=$('#cont'),it=this.cur();$('#bClr').hidden=!this.img;$('#pos').textContent=(this.idx+1)+' / '+this.order.length;
if(this.img){c.innerHTML='<img alt="">';c.firstChild.src=this.img;return}
const pic=$('#oPic').checked?picFor(it.w):null;
if(pic){c.innerHTML='<div class="pic"><svg viewBox="0 0 100 100" aria-hidden="true">'+pic+'</svg></div><div class="cap">'+esc(it.w)+(it.m&&$('#oM').checked?'<small>'+esc(it.m)+'</small>':'')+'</div>';return}
c.innerHTML='<div class="w">'+esc(it.w)+'</div>'+(it.m&&$('#oM').checked?'<div class="m">'+esc(it.m)+'</div>':'');const st=$('#stage'),rem=parseFloat(getComputedStyle(document.documentElement).fontSize);c.querySelector('.w').style.fontSize=Math.max(2.6*rem,Math.min(9*rem,st.clientWidth*.9/(Math.max(it.w.length,3)*.6),st.clientHeight*.5))+'px'},
tiles(){const n=this.n,t=$('#tiles');$('#stage').classList.remove('done');t.style.gridTemplateColumns='repeat('+n+',1fr)';t.style.gridTemplateRows='repeat('+n+',1fr)';let h='';
for(let i=0;i<n*n;i++){const ci=(i+Math.floor(i/n))%6;h+='<button class="tile'+((ci===3||ci===4)?' wt':'')+'" style="background:'+COL[ci]+'">'+(i+1)+'</button>'}t.innerHTML=h;t.querySelectorAll('.tile').forEach(x=>x.style.fontSize=(n>5?1.8:2.3)+'rem')},
closed(){return Array.prototype.slice.call(document.querySelectorAll('.tile:not(.open)'))},
openTile(t){if(t.classList.contains('open'))return;t.classList.add('open');SFX.pop();if(!this.closed().length){SFX.good();$('#stage').classList.add('done')}},
openOne(){const c=this.closed();if(!c.length){this.next();return}this.openTile(c[Math.floor(Math.random()*c.length)])},
all(){const c=this.closed();if(!c.length)return;c.forEach(t=>t.classList.add('open'));$('#stage').classList.add('done');SFX.good()},
next(){this.idx++;if(this.idx>=this.order.length){this.order=shuffle(ITEMS);this.idx=0;toast('All words used. Starting again with a new order.')}this.img=null;this.round()},
space(){if(isOpen('#modal')){closeModal();return}this.openOne()},
key(e){const k=e.key.toLowerCase();if(k==='a')this.all();if(k==='n')this.next()},
demoText(){return /-/.test(location.hash)?SAMPLES['Animals']+'\n'+SAMPLES['Food 日本語·한국어']:SAMPLES['Animals']},
demo(h){const t=document.querySelectorAll('.tile'),mw=(h.match(/-([a-z ]+)$/)||[])[1]||'giraffe';this.idx=Math.max(0,this.order.findIndex(x=>x.w===mw));this.content();[1,5,6,10,13].forEach(i=>{if(t[i])t[i].classList.add('open')});[2,1,1,0].forEach((v,i)=>{if(TEAMS[i])TEAMS[i].score=v});drawTeams();if(h.indexOf('demo2')===0)this.all()}
};
boot();
</script>
