function tone(f,d,type,v,when,to){if(!SOUND)return;try{const c=ac();if(!c)return;const t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function noise(d,v){if(!SOUND)return;try{const c=ac();if(!c)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=c.createBufferSource(),g=c.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(c.destination);s.start()}catch(e){}}
const SFX={click:()=>tone(700,.05,'square',.05),ding:()=>tone(880,.15,'triangle',.25),good:()=>{tone(523,.12,'triangle',.3);tone(659,.12,'triangle',.3,.1);tone(784,.25,'triangle',.3,.2)},bad:()=>tone(220,.35,'sawtooth',.15,0,110),tick:()=>tone(1500,.03,'square',.05),pop:()=>{tone(1000,.12,'sine',.35,0,150);noise(.08,.3)},boom:()=>{noise(1.2,.8);tone(90,.8,'sine',.5,0,30)},alarm:()=>{for(let i=0;i<4;i++)tone(880,.15,'square',.12,i*.25)},win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.25,i*.13))}};
function parseList(text){const out=[],seen={},cats=[];let cat='',dup=0,trunc=0;
String(text||'').split(/\r?\n/).forEach(raw=>{const line=raw.trim();if(!line)return;
if(line.charAt(0)==='#'){cat=line.replace(/^#+\s*/,'').trim();if(cat&&cats.indexOf(cat)<0)cats.push(cat);return}
let w=line,m='';const seps=['\t','=','|',' - '];for(let s=0;s<seps.length;s++){const i=line.indexOf(seps[s]);if(i>0){w=line.slice(0,i).trim();m=line.slice(i+seps[s].length).trim();break}}
if(!w)return;const k=w.toLowerCase();if(seen[k]){dup++;return}seen[k]=1;if(out.length>=100){trunc++;return}out.push({w:w,m:m,cat:cat})});
return {items:out,cats:cats.filter(c=>out.some(x=>x.cat===c)),dup:dup,trunc:trunc,hasM:out.some(x=>x.m)}}
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms||3200)}
function show(id){$(id).classList.add('show')}
function hide(id){$(id).classList.remove('show')}
function isOpen(id){const e=$(id);return !!e&&e.classList.contains('show')}
function modal(band,color,body,btns){const b=$('#mBand');b.textContent=band;b.style.background=color||'#FFC83D';b.style.color=/8E5BE8|E8457A/i.test(color||'')?'#fff':'#1E2030';$('#mBody').innerHTML=body;const w=$('#mBtns');w.innerHTML='';(btns||[]).forEach(x=>{const e=document.createElement('button');e.className='btn L '+(x.c||'');e.innerHTML=x.t;if(x.bg){e.style.background=x.bg;e.style.color='#1E2030'}e.onclick=x.f;w.appendChild(e)});show('#modal')}
function closeModal(){hide('#modal')}
function setTeams(n){const nm=LS.get('teamnames',[]),old=TEAMS;TEAMS=[];for(let i=0;i<n;i++)TEAMS.push({name:nm[i]||('Team '+(i+1)),score:old[i]?old[i].score:0});drawTeams()}
function drawTeams(){const el=$('#teams');if(!el)return;if(G.noStrip){el.style.display='none';return}const cu=(CUSTOM>0?'+':'')+CUSTOM,ST=G.step||1;el.style.gridTemplateColumns='repeat('+TEAMS.length+',minmax(0,1fr))';el.innerHTML=TEAMS.map((t,i)=>'<div class="team'+(G.turn===i?' on':'')+'" style="background:'+TC[i]+'"><div class="r1"><span aria-hidden="true" style="opacity:.55;flex:none">✎</span><input class="tn" data-i="'+i+'" value="'+esc(t.name)+'" maxlength="16" aria-label="Team name (click to rename)" title="Click to rename"><b class="sc">'+t.score+'</b></div><div class="pm"><button data-i="'+i+'" data-d="-'+ST+'">−'+ST+'</button><button data-i="'+i+'" data-d="'+ST+'">+'+ST+'</button><button data-i="'+i+'" data-d="'+CUSTOM+'">'+cu+'</button></div></div>').join('')}
function addScore(i,d){if(!TEAMS[i])return;TEAMS[i].score+=d;drawTeams();(d>0?SFX.good:SFX.bad)();const s=$('#teams').children[i];if(s){s.classList.add('bump');setTimeout(()=>s.classList.remove('bump'),350)}}
function leaders(){const m=Math.max.apply(null,TEAMS.map(t=>t.score));return TEAMS.filter(t=>t.score===m)}
function scoreLine(){return TEAMS.map(t=>esc(t.name)+': '+t.score).join(' · ')}
function winnerHTML(){const w=leaders();return '<div class="big">'+(w.length>1?'It’s a tie!':esc(w[0].name)+' wins!')+'</div><div class="sub">'+scoreLine()+'</div>'}
function fit(el,max,min){if(!el)return;let s=max,g=0;el.style.fontSize=s+'rem';while(s>min&&g++<90&&(el.scrollHeight>el.clientHeight+2||el.scrollWidth>el.clientWidth+2)){s=Math.max(min,s-.15);el.style.fontSize=s+'rem'}}
function fullscreen(){const d=document,el=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const r=el.requestFullscreen||el.webkitRequestFullscreen;if(r){const p=r.call(el);if(p&&p.catch)p.catch(()=>{})}}}catch(e){}}
function openHelp(){const keys=(G.keys||[]).concat([['F',G.fNote||'Full screen on / off'],['?','Show this help'],['Esc','Close a window']]);$('#helpBody').innerHTML=(G.help||'')+'<table class="kt">'+keys.map(k=>'<tr><td><span class="k">'+k[0]+'</span></td><td>'+k[1]+'</td></tr>').join('')+'</table>';show('#help')}
function updStat(){const p=parseList($('#ta').value),n=p.items.length;let m;
if(n===0&&G.optional&&G.optional())m='<span class="ok">'+(G.optNote||'No words needed for this mode.')+'</span>';
else if(n<5)m='<span class="warn">'+n+' entr'+(n===1?'y':'ies')+' — add at least 5 to play.</span>';else m='<span class="ok">✓ '+n+' entries ready</span>';
if(p.dup)m+=' · '+p.dup+' duplicate'+(p.dup>1?'s':'')+' removed';if(p.trunc)m+=' · <span class="warn">only the first 100 are used</span>';if(p.cats.length)m+=' · '+p.cats.length+' categor'+(p.cats.length>1?'ies':'y');if(n&&!p.hasM)m+=' · no meanings';
$('#stat').innerHTML=m;return p}
function drawSaved(){const L=LS.get('lists',[]);$('#selL').innerHTML=L.length?L.map((x,i)=>'<option value="'+i+'">'+esc(x.n)+'</option>').join(''):'<option value="">(no saved lists yet)</option>'}
function start(){const p=updStat(),n=p.items.length,opt=G.optional&&G.optional();
if(n<5&&!(opt&&n===0)){toast(n?'At least 5 entries are needed to play (you have '+n+').':'Paste at least 5 entries, or choose a sample list.');SFX.bad();return}
P=p;ITEMS=p.items;const nm=$('#nm').value.trim();LS.set('current',{n:nm,t:$('#ta').value});try{if(!/^#demo/.test(location.hash))history.replaceState(null,'','#'+listHash())}catch(e){}
CUSTOM=parseInt($('#cust').value,10)||5;LS.set('custom_'+G.id,CUSTOM);
const tn=+$('#selT').value;LS.set('teams',tn);setTeams(tn);
$('#lname').textContent=n?('· '+(nm?nm+' · ':'')+n+' words'+(G.needM&&!p.hasM?' · word-only mode':'')):'';
hide('#setup');closeModal();STARTED=true;
const m=[];if(p.trunc)m.push('Only the first 100 entries are used ('+(n+p.trunc)+' found).');if(p.dup)m.push(p.dup+' duplicate'+(p.dup>1?'s':'')+' removed.');if(G.needM&&n&&!p.hasM)m.push(G.needM);
if(m.length)toast(m.join(' '),7000);
G.start(p)}
function restart(){if(!STARTED){openWords();return}if(G.beforeRestart)G.beforeRestart();TEAMS.forEach(t=>t.score=0);if(G.turn!=null)G.turn=0;closeModal();(G.restart||G.start).call(G,P);drawTeams();toast('New round: scores cleared')}
function openWords(){if(G.stop)G.stop();closeModal();show('#setup')}
function onKey(e){const tg=(e.target&&e.target.tagName)||'';
if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'){if(e.key==='Escape'||(e.key==='Enter'&&tg==='INPUT'))e.target.blur();return}
if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
if(k==='Escape'){if(isOpen('#help')){hide('#help');return}if(isOpen('#setup')){if(STARTED)hide('#setup');return}if(G.esc&&G.esc())return;closeModal();return}
if(isOpen('#help'))return;
if(k==='?'){e.preventDefault();openHelp();return}
if(isOpen('#setup')){if(k===' '||e.code==='Space'){e.preventDefault();start()}return}
if(k===' '||e.code==='Space'){e.preventDefault();if(G.space)G.space();return}
if((k==='f'||k==='F')&&!(G.useF&&G.useF())){fullscreen();return}
if(G.key)G.key(e)}
const GAMES=[['01-quiz-board','Quiz Board'],['02-spin-wheel','Spin Wheel'],['03-hidden-picture','Hidden Picture'],['04-letter-guess','Letter Guess'],['05-hot-potato','Hot Potato'],['06-memory-match','Memory Match'],['07-unscramble','Unscramble'],['08-quick-fire','Quick Fire'],['09-scoreboard','Scoreboard'],['10-quiz-choice','Quiz Choice']];
function hashList(h){if(!h||h.indexOf('w=')!==0)return null;const o={t:'',n:''};h.split('&').forEach(p=>{try{if(p.indexOf('w=')===0)o.t=decodeURIComponent(p.slice(2));if(p.indexOf('n=')===0)o.n=decodeURIComponent(p.slice(2))}catch(e){}});return o.t?o:null}
function listHash(){return 'w='+encodeURIComponent($('#ta').value)+'&n='+encodeURIComponent($('#nm').value.trim())}
function goGame(f){LS.set('current',{n:$('#nm').value.trim(),t:$('#ta').value});location.href=f+'#'+listHash()}
function openGames(){if(G.stop)G.stop();modal('Switch game · keep this word list','#5BB8F5','<div class="sub" style="margin:0">Your word list goes with you. Scores start again in the new game.</div>',GAMES.filter(g=>g[0].slice(0,2)!==G.id).map(g=>({t:g[0].slice(0,2)+' '+g[1],f:()=>goGame(g[0]+'.html')})).concat([{t:'⌂ START-HERE',c:'p',f:()=>goGame('../START-HERE.html')},{t:'Cancel',f:closeModal}]))}
function boot(){const s=$('#selS');s.innerHTML='<option value="">Choose a sample list…</option>'+Object.keys(SAMPLES).map(k=>'<option>'+esc(k)+'</option>').join('');
drawSaved();const mx=G.maxTeams||6,t=$('#selT');let h='';for(let i=2;i<=mx;i++)h+='<option>'+i+'</option>';t.innerHTML=h;t.value=String(Math.min(mx,Math.max(2,LS.get('teams',4))));
$('#cust').value=LS.get('custom_'+G.id,G.custom||5);$('#opts').innerHTML=G.opts||'';
const H=location.hash.slice(1),demo=H.indexOf('demo')===0,HW=hashList(H),cur=HW||LS.get('current',null);if(HW){LS.set('current',HW);setTimeout(()=>toast('Same word list as before: '+parseList(HW.t).items.length+' entries. Press Space to play.',4500),400)}
if(demo){$('#ta').value=G.demoText?G.demoText():SAMPLES[G.demoList||'Animals'];$('#nm').value=G.demoName||G.demoList||'Animals'}
else if(cur&&cur.t){$('#ta').value=cur.t;$('#nm').value=cur.n||''}
else{const k=G.demoList||'Animals';$('#ta').value=SAMPLES[k];$('#nm').value=k}
if(G.init)G.init();
s.onchange=()=>{if(!s.value)return;$('#ta').value=SAMPLES[s.value];$('#nm').value=s.value;updStat()};
$('#ta').oninput=()=>{clearTimeout(boot._t);boot._t=setTimeout(updStat,200)};
$('#bImp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#ta').value=String(r.result);$('#nm').value=f.name.replace(/\.txt$/i,'').slice(0,40);updStat();toast('Imported '+f.name)};r.readAsText(f,'UTF-8');e.target.value=''};
$('#bExp').onclick=()=>{const b=new Blob([$('#ta').value],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(($('#nm').value||'').replace(/[\\\/:*?"<>|]+/g,'').trim()||'word-list')+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
$('#bSave').onclick=()=>{const n=$('#nm').value.trim()||'My list',L=LS.get('lists',[]);let i=-1;L.forEach((x,j)=>{if(x.n===n)i=j});if(i<0){if(L.length>=200){toast('You can keep 200 saved lists. Delete one first.');return}L.push({n:n,t:$('#ta').value});i=L.length-1}else L[i].t=$('#ta').value;LS.set('lists',L);drawSaved();$('#selL').value=String(i);$('#nm').value=n;toast('Saved “'+n+'” in this browser')};
const sel=()=>{const L=LS.get('lists',[]),i=parseInt($('#selL').value,10);if(isNaN(i)||!L[i]){toast('No saved list selected.');return null}return {L:L,i:i}};
$('#bLoad').onclick=()=>{const r=sel();if(!r)return;$('#ta').value=r.L[r.i].t;$('#nm').value=r.L[r.i].n;updStat();toast('Loaded “'+r.L[r.i].n+'”')};
$('#bRen').onclick=()=>{const r=sel();if(!r)return;const n=prompt('New name for this list:',r.L[r.i].n);if(!n||!n.trim())return;r.L[r.i].n=n.trim().slice(0,40);LS.set('lists',r.L);drawSaved();$('#selL').value=String(r.i)};
$('#bDel').onclick=()=>{const r=sel();if(!r)return;if(!confirm('Delete “'+r.L[r.i].n+'”?'))return;r.L.splice(r.i,1);LS.set('lists',r.L);drawSaved();toast('Deleted')};
$('#bStart').onclick=start;$('#bWords').onclick=openWords;$('#bRestart').onclick=restart;
$('#bSound').onclick=()=>{SOUND=!SOUND;LS.set('sound',SOUND);$('#bSound').classList.toggle('muted',!SOUND);if(SOUND)SFX.click()};$('#bSound').classList.toggle('muted',!SOUND);
$('#bFull').onclick=fullscreen;$('#bHelp').onclick=openHelp;$('#bGames').onclick=openGames;$('#bGames2').onclick=openGames;
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>hide('#'+b.dataset.x));
const T=$('#teams');T.addEventListener('click',e=>{const b=e.target.closest('button[data-d]');if(b)addScore(+b.dataset.i,+b.dataset.d)});
T.addEventListener('change',e=>{const n=e.target.closest('.tn');if(!n)return;const i=+n.dataset.i;TEAMS[i].name=n.value.trim()||('Team '+(i+1));LS.set('teamnames',TEAMS.map(x=>x.name))});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b)setTimeout(()=>b.blur(),0)});
document.addEventListener('keydown',onKey);
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>e.preventDefault());
window.addEventListener('resize',()=>{if(G.resize&&STARTED)G.resize()});
updStat();
if(demo){start();TEAMS.forEach((x,i)=>x.name=DEMO_NAMES[i]);drawTeams();if(G.demo)G.demo(H)}
else if(G.autoStart&&G.autoStart()){start();if(!STARTED)show('#setup')}
else show('#setup')}
</script>
<script>
const G={id:'08',demoList:'Daily routine',fNote:'Full screen when no round is running. During a round, F = ✗ skip (X also works).',
opts:'<label>Seconds per word<select id="oS"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>8</option><option>10</option><option>12</option><option>15</option></select></label><label>Show<select id="oW"><option value="w">The word</option><option value="m">The meaning</option></select></label><label>Words per round<select id="oN"><option value="10">10</option><option value="20">20</option><option value="0">All</option></select></label>',
help:'<p>Words flash on the screen one by one. A student (or a whole team) says each word, its meaning or a sentence before the bar runs out.</p><ol><li>Press <b>Space</b> to start a round.</li><li>Press <b>J</b> (✓) when the answer is right, or <b>F</b> (✗) to skip. When time runs out, the word counts as skipped.</li><li>At the end you see how many were right, how many were skipped, and the full list.</li><li>Add the result to a team with one click, then start the next team’s round.</li></ol>',
keys:[['Space','Start a round / skip during a round'],['J','✓ Correct'],['X','✗ Skip']],
list:[],i:0,res:[],run:false,iv:null,t0:0,secs:5,
init(){$('#bGo').onclick=()=>this.go();$('#bOk').onclick=()=>this.mark(true);$('#bNo').onclick=()=>this.mark(false)},
useF(){return this.run},
start(p){this.stop();this.idle()},
restart(){this.start(P)},
stop(){clearInterval(this.iv);this.run=false},
idle(){this.run=false;$('#bRun').hidden=true;$('#bIdle').hidden=false;$('#qp').textContent='';$('#qc').textContent='';$('#qi').style.fontSize='2.6rem';$('#qi').textContent='Ready? Press Space';$('#tb').style.width='100%';$('#tb').className=''},
go(){if(isOpen('#modal'))closeModal();const n=+$('#oN').value;this.secs=+$('#oS').value;this.list=shuffle(ITEMS).slice(0,n||ITEMS.length);this.i=0;this.res=[];this.run=true;$('#bRun').hidden=false;$('#bIdle').hidden=true;this.show()},
show(){clearInterval(this.iv);const it=this.list[this.i],txt=$('#oW').value==='m'&&it.m?it.m:it.w,q=$('#qi');q.textContent=txt;fit(q,txt.length>20?3.4:6,2.6);
$('#qp').textContent=(this.i+1)+' / '+this.list.length;$('#qc').innerHTML='✓ <b>'+this.res.filter(r=>r.ok).length+'</b>';this.t0=performance.now();let last=this.secs;
this.iv=setInterval(()=>{const left=this.secs-(performance.now()-this.t0)/1000,b=$('#tb');b.style.width=Math.max(0,left/this.secs*100)+'%';b.className=left<this.secs*.3?'low':'';const s=Math.ceil(left);if(s<last&&s<=3&&s>0){SFX.tick()}last=s;if(left<=0)this.mark(false)},50)},
mark(ok){if(!this.run)return;clearInterval(this.iv);this.res.push({it:this.list[this.i],ok:ok});if(ok)SFX.ding();else tone(260,.15,'triangle',.15);this.i++;if(this.i>=this.list.length)this.end();else this.show()},
end(){this.stop();const c=this.res.filter(r=>r.ok).length,s=this.res.length-c;$('#bRun').hidden=true;$('#bIdle').hidden=false;$('#qi').style.fontSize='2.6rem';$('#qi').textContent=c+' correct · '+s+' skipped';SFX.win();
modal('Round complete','#3DD39A','<div class="big">'+c+' correct</div><div class="sub">'+s+' skipped or timed out</div><div class="rl">'+this.res.map(r=>'<span class="'+(r.ok?'y':'n')+'">'+(r.ok?'✓ ':'✗ ')+esc(r.it.w)+'</span>').join('')+'</div>',
TEAMS.map((t,i)=>({t:'+'+c+' '+esc(t.name),bg:TC[i],f:()=>{addScore(i,c);closeModal()}})).concat([{t:'New round <span class="k">Space</span>',c:'p',f:()=>this.go()}]))},
space(){if(this.run)this.mark(false);else this.go()},
key(e){const k=e.key.toLowerCase();if(!this.run)return;if(k==='j')this.mark(true);if(k==='f'||k==='x')this.mark(false)},
demo(h){this.list=shuffle(ITEMS).slice(0,10);this.i=3;this.res=[{ok:true},{ok:true},{ok:false}].map((r,i)=>({it:this.list[i],ok:r.ok}));this.run=true;$('#bRun').hidden=false;$('#bIdle').hidden=true;this.secs=5;this.show();clearInterval(this.iv);$('#tb').style.width='55%';[4,6,3,5].forEach((v,i)=>{if(TEAMS[i])TEAMS[i].score=v});drawTeams();
if(h==='demo2'){this.res=this.list.map((it,i)=>({it:it,ok:i%4!==2}));this.end()}}
};
boot();
</script>
