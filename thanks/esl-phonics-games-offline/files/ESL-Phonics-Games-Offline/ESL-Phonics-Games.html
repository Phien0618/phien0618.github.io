<title>ESL Phonics Games Offline</title>
<!-- ESL Phonics Games Offline. Single teacher licence. Works with no internet: no fonts, images or scripts are loaded from anywhere. Game words use built-in single-storey SVG letters. -->
<style>
:root{--paper:#FFF8EC;--ink:#2A2340;--sun:#FFC93C;--sky:#3AA7E8;--leaf:#4CB963;--berry:#E8457A;--grape:#8C5BD6;--orange:#FF8A3D;--teal:#22B3A6;--mute:#625C74;
--ui:"Baloo 2","Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei","Malgun Gothic",sans-serif;
--tx:"Andika","Comic Sans MS","Chalkboard SE","Segoe UI",system-ui,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei","Meiryo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#EFE6D6}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);background-image:radial-gradient(rgba(42,35,64,.07) 2px,transparent 2px);background-size:40px 40px;color:var(--ink);font-family:var(--tx);overflow:hidden;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.gw{display:block;overflow:visible}
.gw path,.gw circle{fill:none;stroke:currentColor;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.gw .f{fill:currentColor;stroke:none}
.gw .hl{fill:var(--sun);stroke:none}
.gw .bk{stroke:var(--grape);stroke-width:9}
.gw .bar{stroke-width:13}
.gw .mg{stroke:var(--grape);stroke-width:7}
.gw text{fill:currentColor;stroke:none;font:700 100px var(--tx)}
.pic{stroke:#2A2340;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;display:block}
.pic .n{stroke:none}.pic .h{fill:#fff;stroke:none;opacity:.75}
/* header */
.hd{position:absolute;left:40px;right:40px;top:14px;height:96px;display:flex;align-items:center;gap:16px}
.gname{height:72px;padding:0 34px;border:4px solid var(--ink);border-radius:999px;background:var(--sun);font:800 38px/64px var(--ui);box-shadow:0 6px 0 var(--ink);white-space:nowrap}
.chips{flex:1;display:flex;justify-content:center;gap:12px;min-width:0;overflow:hidden}
.chip{height:56px;padding:0 22px;border:4px solid var(--ink);border-radius:999px;display:flex;align-items:center;white-space:nowrap;font:700 26px var(--ui)}
.ib{width:72px;height:72px;border:4px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:38px;height:38px}
.tmr{width:88px;height:88px;border:none;background:none;flex:none;position:relative}
.tmr svg{width:88px;height:88px}
/* play area */
.pa{position:absolute;left:72px;right:72px;top:126px;height:752px}
.tb{position:absolute;left:40px;right:40px;bottom:22px;height:164px;display:flex;gap:24px}
.team{flex:1;min-width:0;background:#fff;border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 rgba(42,35,64,.2);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.team.on{transform:translateY(-8px);box-shadow:0 0 0 7px var(--sun),0 12px 0 rgba(42,35,64,.25)}
.band{height:56px;display:flex;align-items:center;gap:8px;padding:0 22px;font:800 30px var(--ui);white-space:nowrap;overflow:hidden;cursor:pointer}
.band svg{width:30px;height:30px;flex:none}
.tbody{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.score{font:800 60px var(--ui)}
.rb{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center}
.rb svg{width:28px;height:28px}
.btn{height:84px;padding:0 34px;border:4px solid var(--ink);border-radius:999px;background:#fff;box-shadow:0 6px 0 var(--ink);font:800 36px var(--ui);display:inline-flex;align-items:center;gap:12px;white-space:nowrap}
.btn svg{width:34px;height:34px;flex:none}
.btn.pri{background:var(--leaf)}
.btn.ok{background:#DDF3E1}.btn.no{background:#FCE0EA}
.btn:active,.ib:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.acts{position:absolute;right:0;bottom:6px;display:flex;gap:20px}
.turn{position:absolute;left:0;top:0;height:64px;padding:0 26px;border:4px solid var(--ink);border-radius:999px;display:flex;align-items:center;font:800 30px var(--ui);white-space:nowrap}
.seg{position:absolute;right:0;top:0;display:flex;align-items:center;gap:10px;font:700 26px var(--ui)}
.seg .lbl{margin-right:4px;color:var(--mute)}
.sg{height:64px;min-width:64px;padding:0 18px;border:4px solid var(--ink);border-radius:18px;background:#fff;font:800 28px var(--ui)}
.sg.on{background:var(--sun)}
.pc{background:#fff;border:5px solid var(--ink);border-radius:36px;box-shadow:0 10px 0 var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.tile{background:#fff;border:5px solid var(--ink);border-radius:30px;box-shadow:0 12px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:16px 34px;min-height:300px}
.tile.sun{background:var(--sun)}
.tile.empty{background:#fff;border-style:dashed;min-width:120px}
.arr{width:96px;height:68px;border:4px solid var(--ink);border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center}
.arr svg{width:30px;height:30px}
.hint{font:700 30px var(--ui);color:var(--mute);text-align:center}
.mean{font:700 44px var(--tx);text-align:center;min-height:56px}
.opt{border:5px solid var(--ink);border-radius:999px;background:#fff;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.opt:hover:not(:disabled){background:#FFF0C2}
.opt.right{background:var(--leaf)}.opt.wrong{background:var(--berry)}
.opt:disabled{opacity:1}
.opt .mk{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:52px;height:52px}
.opt .num{position:absolute;left:24px;top:50%;transform:translateY(-50%);font:800 26px var(--ui);color:var(--mute)}
.res{height:84px;padding:0 34px;border:4px solid var(--ink);border-radius:999px;display:inline-flex;align-items:center;gap:14px;font:800 40px var(--ui)}
.res svg{width:44px;height:44px}
/* start */
.logo{position:absolute;left:56px;top:34px;display:flex;align-items:center;gap:12px}
.blk{width:76px;height:76px;border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:#fff}
.logo h1{font:800 64px var(--ui);margin-left:18px}
.ftag{margin-left:14px;height:52px;padding:0 20px;border:4px solid var(--ink);border-radius:999px;background:var(--sun);font:800 26px/44px var(--ui)}
.sett{position:absolute;right:56px;top:26px;text-align:right}
.sett .t1{font:700 24px var(--ui);color:var(--mute)}
.sett .row{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;font:700 28px var(--ui)}
.stp{width:64px;height:64px;border:4px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);font:800 34px var(--ui);display:flex;align-items:center;justify-content:center}
.stp svg{width:26px;height:26px}
.sv{min-width:76px;text-align:center;font:800 34px var(--ui)}
.h2{position:absolute;left:56px;display:flex;align-items:center;gap:16px;font:800 34px var(--ui)}
.badge{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:800 28px var(--ui)}
.cnt{position:absolute;right:56px;top:142px;display:flex;gap:16px;align-items:center}
.cntp{height:68px;padding:0 30px;border:4px solid var(--ink);border-radius:999px;background:var(--sun);box-shadow:0 6px 0 var(--ink);font:800 32px/60px var(--ui);white-space:nowrap}
.cols{position:absolute;left:56px;right:56px;top:226px;height:372px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px}
.cols.dim .col{opacity:.45}
.col{min-width:0;background:#fff;border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 rgba(42,35,64,.18);overflow:hidden}
.colh{display:block;width:100%;text-align:left;border:none;padding:10px 16px 8px;font:800 26px/1.1 var(--ui);white-space:nowrap;overflow:hidden}
.colh small{display:block;font:700 18px var(--ui);opacity:.9}
.unit{display:flex;align-items:center;gap:12px;width:calc(100% - 20px);margin:5px 10px 0;height:54px;padding:0 12px;border:none;border-radius:14px;background:none;text-align:left}
.unit.on{background:#FFF0C2}
.unit .cb{width:38px;height:38px;flex:none}
.unit .ul{flex:1;min-width:0;color:var(--ink)}
.unit .uc{font:700 22px var(--ui);color:var(--mute)}
.unit.lock{opacity:.4}
.cbar{position:absolute;left:470px;top:146px;height:60px;display:flex;align-items:center;gap:14px;font:700 28px var(--ui);background:#fff;border:4px solid var(--ink);border-radius:999px;padding:0 8px 0 24px}
.cbar button{height:48px;padding:0 18px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);font:800 22px var(--ui)}
.cards{position:absolute;left:56px;right:56px;top:690px;height:262px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px}
.gc{position:relative;min-width:0;background:#fff;border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;padding:16px 14px 10px;text-align:center}
.gc .ic{width:108px;height:108px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.gc .ic svg{width:84px;height:84px}
.gc b{font:800 32px/1.1 var(--ui);margin-top:12px}
.gc span{font:400 21px/1.25 var(--tx);color:#3E3852;margin-top:8px}
.gc.lock{background:#EEEAF2;box-shadow:0 8px 0 #9C95AD}
.gc.lock>*:not(.lk){opacity:.35}
.lk{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:999px;background:var(--ink);color:#fff;font:800 20px var(--ui)}
.lk svg{width:20px;height:20px}
.foot{position:absolute;left:56px;right:56px;bottom:30px;display:flex;justify-content:space-between;font:700 24px var(--ui);color:var(--mute)}
.foot b{color:var(--ink)}
.buy{height:64px;padding:0 26px;border:4px solid var(--ink);border-radius:999px;background:var(--leaf);box-shadow:0 5px 0 var(--ink);font:800 26px/56px var(--ui);color:var(--ink);text-decoration:none;display:inline-block}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(42,35,64,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.md{background:var(--paper);border:6px solid var(--ink);border-radius:36px;box-shadow:0 14px 0 var(--ink);padding:44px 52px;max-width:1560px;max-height:1000px;overflow:auto}
.md h2{font:800 52px var(--ui);margin-bottom:18px}
.md p,.md li{font:400 30px/1.4 var(--tx)}
.md ul{margin-left:34px}
.md .mrow{display:flex;gap:20px;justify-content:flex-end;margin-top:30px}
.md input[type=text],.md textarea{font:400 30px var(--tx);border:4px solid var(--ink);border-radius:18px;padding:12px 18px;background:#fff;color:var(--ink);width:100%;user-select:text}
.md textarea{height:420px;resize:none;line-height:1.35}
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;font:400 28px var(--tx);margin-top:16px}
.keys kbd{font:800 26px var(--ui);background:#fff;border:3px solid var(--ink);border-radius:10px;padding:2px 14px;text-align:center}
.ed{width:1420px}
.edg{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px}
.edl{background:#fff;border:4px solid var(--ink);border-radius:24px;padding:14px;height:640px;overflow:auto}
.lrow{display:flex;align-items:center;gap:8px;padding:8px;border-radius:14px}
.lrow.on{background:#FFF0C2}
.lrow b{flex:1;min-width:0;font:800 26px var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow small{font:700 20px var(--ui);color:var(--mute)}
.sb{height:56px;padding:0 18px;border:3px solid var(--ink);border-radius:999px;background:#fff;font:800 22px var(--ui);white-space:nowrap}
.lp{font:700 26px var(--ui);margin-top:12px;min-height:72px;color:var(--ink)}
.lp .warn{color:#B0164E}
.toast{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:18px 40px;font:800 36px var(--ui);z-index:70;white-space:nowrap;pointer-events:none}
.flash{position:absolute;inset:0;background:var(--sun);opacity:0;pointer-events:none;z-index:60}
.flash.go{animation:fl .9s}
@keyframes fl{0%,50%,100%{opacity:0}20%,70%{opacity:.85}}
.grid{position:absolute;left:0;right:0;top:84px;bottom:0;display:grid;gap:16px}
.card{border:5px solid var(--ink);border-radius:24px;background:var(--sun);box-shadow:0 7px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:6px;min-width:0;min-height:0;overflow:hidden}
.card.up{background:#fff}.card:disabled{opacity:1}
.card.done{background:#fff;border-width:7px}
.card svg.pic{height:88%;width:auto}
.card .cq{width:58px;height:58px;opacity:.55}
#qa-m{position:fixed;left:8px;top:8px;z-index:99;background:#000;color:#0f0;font:14px monospace;padding:6px 10px;white-space:pre}
.stx{position:static;overflow:auto;height:auto;width:auto;padding:30px;font:16px/1.4 system-ui,sans-serif;background:#fff;color:#000;user-select:text}
</style>  <script data-goatcounter="https://phien.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

 const nonDup=[];const ns=new Set();UNITS.forEach(u=>u.nons.forEach(w=>{if(ns.has(w))nonDup.push(w);ns.add(w);}));
 const blocked=[];UNITS.forEach(u=>u.words.concat(u.nons).forEach(w=>{if(BLOCK.has(w))blocked.push(w);}));
 const pk=Object.keys(PICS),picBad=pk.filter(k=>!REAL.has(k));const cvcP=UNITS.filter(u=>u.st===1).map(u=>u.label+': '+u.words.filter(w=>PICS[w]).length);
 // generated Missing Letters options over every built-in word, 20 runs each
 let mlBlocked=0,mlRuns=0;UNITS.forEach(u=>u.words.forEach(w=>{const it=mk(w,u.id);const bl=blankOf(it);for(let r=0;r<20;r++){const o=mlOptions(it,bl);mlRuns++;o.forEach(k=>{if(BLOCK.has(fillWith(it,bl,k)))mlBlocked++;});}}));
 const pt=parseList('ship\nsh-i-p\ncat = 猫\nkitten = ねこ\n\nship\n# comment line\nfish = 물고기\nhen\nbed',100);
 const ptRows=pt.items.map(i=>`<tr><td>${esc(i.w)}</td><td>${i.ch.map(esc).join(' | ')}</td><td>${esc(i.m)}</td></tr>`).join('');
 const big=parseList(Array.from({length:130},(_,i)=>'w'+i).join('\n'),100);
 const res=(ok,t)=>`<li style="color:${ok?'#060':'#b00'}"><b>${ok?'PASS':'FAIL'}</b> ${t}</li>`;
 document.body.innerHTML=`<div class="stx"><h1>ESL Phonics Games: self-test (run in the browser on the shipped file)</h1><p>data hash ${dataHash()} · run ${new Date().toISOString()}</p><ul>
 ${res(cnt===22,'units: '+cnt)}${res(tot===452,'real words: '+tot)}${res(totN===220,'nonsense words: '+totN+' (10 per unit: '+UNITS.every(u=>u.nons.length===10)+')')}
 ${res(dupIn.length===0,'duplicates inside a unit: '+dupIn.length+' '+dupIn.join(' '))}${res(dupX.length===0,'duplicates across units: '+dupX.length+' '+dupX.join(' '))}
 ${res(nonReal.length===0,'nonsense words equal to a real word (bank + common list): '+nonReal.length+' '+nonReal.join(' '))}${res(nonDup.length===0,'repeated nonsense words: '+nonDup.length)}
 ${res(bad===0,'words breaking their unit spelling rule: '+bad+' '+badList.join(' '))}${res(blocked.length===0,'bank words on the rude-word filter: '+blocked.length)}
 ${res(pk.length===48&&picBad.length===0,'pictures: '+pk.length+', not in word bank: '+picBad.length)}${res(UNITS.filter(u=>u.st===1).every(u=>u.words.filter(w=>PICS[w]).length>=6),'pictures per CVC unit: '+cvcP.join(', '))}
 ${res(mlBlocked===0,'Missing Letters generated options that spell a filtered word: '+mlBlocked+' in '+mlRuns+' generated questions')}
 ${res(pt.items.length===7&&pt.ig.empty===1&&pt.ig.dup===1&&pt.ig.comment===1,'custom list test (10 lines): kept '+pt.items.length+', ignored empty '+pt.ig.empty+', duplicate '+pt.ig.dup+', comment '+pt.ig.comment)}
 ${res(big.items.length===100&&big.cut===30,'130 pasted words: kept '+big.items.length+', cut '+big.cut)}</ul>
 <table border="1" cellpadding="4" style="border-collapse:collapse;margin-top:10px"><tr><th>stage</th><th>unit</th><th>real</th><th>spec</th><th>count</th><th>nonsense</th><th>pictures</th><th>rule breaks (real)</th><th>rule breaks (nonsense)</th><th>rule checked</th></tr>${rows}<tr><td></td><td><b>total</b></td><td><b>${tot}</b></td><td>452</td><td></td><td><b>${totN}</b></td><td><b>${pk.length}</b></td><td colspan="3"></td></tr></table>
 <h3>Custom list parse result</h3><table border="1" cellpadding="4" style="border-collapse:collapse;font-size:20px"><tr><th>word</th><th>sound chunks</th><th>meaning</th></tr>${ptRows}</table>
 <h3>All 48 pictures</h3><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:1500px">${pk.map(k=>`<div style="border:2px solid #ccc;border-radius:10px;text-align:center;padding:6px;background:#FFF8EC">${picSVG(k).replace('<svg','<svg width="150" height="150" style="margin:auto"')}<div style="font:700 22px sans-serif">${k} <small style="color:#888">${UNITS.find(u=>u.words.includes(k)).label}</small></div></div>`).join('')}</div>
 <h3>Built-in single-storey letters</h3><div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;color:#2A2340">${word(autoChunks('abcdefghijklm'),{px:90})}${word(autoChunks('nopqrstuvwxyz'),{px:90})}${word(autoChunks('bag'),{btn:1,px:120})}${word(autoChunks('egg'),{btn:1,px:120})}${word(autoChunks('cake'),{btn:1,px:120})}${word(autoChunks('sheep'),{btn:1,px:120})}</div></div>`;
 document.documentElement.style.overflow='auto';document.body.style.overflow='auto';}
function qaSetup(){if(QP.has('teams'))ST.teams=+QP.get('teams');if(QP.has('units'))ST.units=new Set(QP.get('units').split(',').filter(x=>UBY[x]&&unitOpen(x)));
 if(QP.has('scores'))QP.get('scores').split(',').forEach((s,i)=>ST.scores[i]=+s);if(QP.has('pm'))ST.pm=+QP.get('pm');if(QP.has('ss'))ST.ss=+QP.get('ss');if(QP.has('wb'))ST.wb=QP.get('wb');if(QP.has('turn'))ST.turn=+QP.get('turn');
 if(QP.get('custom')==='five')useText('Five words','cat\nhen\npig\nsun\nfox');
 if(QP.get('custom')==='ac8')useText('Test list','ship\nsh-i-p\ncat = 猫\nkitten = ねこ\n\nship\n# comment line\nfish = 물고기\nhen\nbed');
 if(QP.has('editor')){ST.edit={id:null,name:'Test list',text:QP.get('editor')==='big'?Array.from({length:120},(_,i)=>['cat','dog','sun','hen','pig','bug'][i%6]+(i>5?i:'')).join('\n'):'ship\nsh-i-p\ncat = 猫\nkitten = ねこ\n\nship\n# comment line\nfish = 물고기\nhen\nbed'};}
 if(QP.has('game')){startGame(QP.get('game'));if(!G)return;const w=QP.get('word');
  if(w){const q=G.deck.q;const i=q.findIndex(x=>(x.w||x.ri)===w||(x.words&&x.words.some(y=>y.w===w)));if(i>=0){q.push(q.splice(i,1)[0]);G.next(true);if(G.cur&&G.cur.words){G.i=G.cur.words.findIndex(y=>y.w===w);}if(G.id==='ml'){G.opts=mlOptions(G.cur,G.bl);}render();}}
  const step=QP.get('step');if(step==='ok'||step==='bad'){const g=G;const pick=(arr,ans)=>{const i=arr.indexOf(ans);return step==='ok'?i:arr.findIndex(x=>x!==ans);};
   if(g.id==='ss')g.act('sso',String(pick(g.opts,g.snd.key)));if(g.id==='ml')g.act('mlo',String(pick(g.opts,g.bl.ans)));if(g.id==='rn')g.act('rno',(step==='ok')===g.cur.non?'alien':'real');if(g.id==='qr')g.act('qrj',step==='ok'?'1':'0');
   if(g.id==='wb'&&g.mode==='pic'){const on=split(g.cur).on.join('').toLowerCase();g.act('wbo',String(pick(g.opts,on)));}}
  if(step==='time'&&G.id==='qr'){G.stop();G.state='time';render();}
  if(step==='hold'&&G.id==='qr'){G.stop();G.left=ST.qr*0.6;render();}
  if(step==='pm'&&G.id==='pm'){const ids=[...new Set(G.cards.map(c=>c.id))];ids.slice(0,3).forEach((id,j)=>G.cards.filter(c=>c.id===id).forEach(c=>c.done=j%ST.teams));G.found=3;const o=G.cards.filter(c=>c.done<0);o[0].up=true;o.find(c=>c.id!==o[0].id).up=true;render();}
  if(step==='pmall'&&G.id==='pm'){G.cards.forEach(c=>{c.done=0;});G.found=G.np;render();G.win();}
  if(step==='pmplay'&&G.id==='pm'){const clk=i=>{const b=document.querySelector('#pa [data-a="card"][data-v="'+i+'"]');if(b&&!b.disabled)b.click();};
   const log=['board: '+G.cards.length+' cards, header "'+$('.hint').textContent+'"'];const ids=[...new Set(G.cards.map(c=>c.id))];
   const a0=G.cards.findIndex(c=>c.id===ids[0]),b0=G.cards.findIndex(c=>c.id===ids[1]);clk(a0);clk(b0);log.push('mismatch click: turn moves after 1.4 s (lock='+G.lock+')');clearTimeout(G.tt);G.cards[a0].up=G.cards[b0].up=false;G.sel=[];G.lock=false;nextTurn();render();
   ids.forEach((id,j)=>{const ix=G.cards.map((c,i)=>c.id===id?i:-1).filter(i=>i>=0);clk(ix[0]);clk(ix[1]);if(j<ids.length-1)log.push('pair '+(j+1)+': '+$('.hint').textContent.split('·').pop().trim());});
   log.push('after last pair: found '+G.found+' / np '+G.np+' · modal: '+(modalOn?$('.ov h2').textContent:'none')+' · header "'+$('.hint').textContent+'"'+' · scores '+ST.scores.slice(0,ST.teams).join('/'));
   const r=document.createElement('div');r.id='qa-r';r.style.cssText='position:fixed;left:0;bottom:0;right:0;background:#111;color:#0f0;font:16px monospace;white-space:pre-wrap;z-index:99;padding:6px;max-height:40%;overflow:hidden';r.textContent=log.join('\n');document.body.appendChild(r);}
  if(step==='wbturn'&&G.id==='wb'){const t=[];const c=s=>{const b=document.querySelector('#pa [data-a="'+s.split(':')[0]+'"]'+(s.includes(':')?'[data-v="'+s.split(':')[1]+'"]':''));b.click();t.push(s+' → turn '+ST.names[ST.turn]);};
   t.push('mode '+G.mode+', start turn '+ST.names[ST.turn]);if(G.mode==='swap'){c('wbj:1');c('next');c('wbj:0');c('wbj:1');c('next');c('next');}else{c('wbo:0');c('next');c('next');}
   const r=document.createElement('div');r.id='qa-r';r.style.cssText='position:fixed;left:0;top:0;background:#111;color:#0f0;font:22px monospace;white-space:pre-wrap;z-index:99;padding:8px';r.textContent=t.join('\n');document.body.appendChild(r);}
  if(step==='exhaust'){G.deck.q=[];G.space();}
  if(step==='help')showHelp();if(step==='restart')restart();if(step==='timer'){TM.left=ST.timer*0.6;TM.run=true;tmDraw();clearInterval(TM.iv);}if(step==='timedone'){TM.done=true;tmDraw();}
  if(step==='stop'&&G.stop)G.stop();}
 if(QP.has('editor'))editor();if(QP.get('start')==='few'){ST.custom={name:'Tiny list',items:parseList('cat\ndog\nsun',100).items};drawStart();startGame('qr');}}
load();fit();
if(QP.has('selftest'))selftest();else{if(QP.has('teams')||QP.has('units')||QP.has('game')||QP.has('custom')||QP.has('editor')||QP.has('start')){qaSetup();}if(ST.screen==='start')drawStart();if(QP.has('editor'))editor();if(QP.get('start')==='few')toast('Choose at least 5 words',60000);qaMetrics();}
